DE_TARIHI','');\n  notes=mergeContractNoteField(notes,'DEPOZITO_IADE_TUTAR','0');\n  notes=mergeContractNoteField(notes,'DEPOZITO_KESINTI','0');\n  notes=mergeContractNoteField(notes,'DEPOZITO_IADE_YONTEM','');\n  notes=mergeContractNoteField(notes,'DEPOZITO_IADE_NOT','');\n  const cBase={resident_id:rData.id,stay_id:sData.id,apartment_id:apartmentId,year_id:sData.year_id||activeYear?.id||null,contract_start_date:contractStart};\n  const cVariants=[\n    {...cBase,contract_end_date:contractEnd,monthly_rent:rent,fee_amount:fee,deposit_amount:deposit,notes},\n    {...cBase,contract_end_date:contractEnd,notes},\n    {...cBase,notes}\n  ];\n  let contractSaved=false;\n  for(const p of cVariants){for(const status of [undefined,'TASLAK','AKTIF']){const q={...p};if(status!==undefined)q.status=status;const cr=await sb.from('contracts').insert(q);if(!cr.error){contractSaved=true;break}}if(contractSaved)break}\n  if(!contractSaved) financeWarning+=' Sözleşme/depozito kaydı oluşturulamadı.';\n  if(kErr){\n    $('#newResidentMsg').textContent='Kayıt oluştu; KBS kaydı eklenemedi: '+kErr.message+financeWarning;\n  } else {\n    $('#newResidentMsg').textContent='Konaklayan, kira ve depozito bilgileri başarıyla kaydedildi.'+financeWarning;\n  }\n\n  await loadAll();\n  renderResidents();\n  setTimeout(()=>$('#newResidentModal').classList.remove('open'),500);\n}\n\n\nfunction renderAll(){\n  renderAlerts();\n  renderFloors();\n  renderKpis();\n  renderApartmentManagement();\n  renderResidents();\n}\n\nconst mobileMenuBtn=$('#mobileMenuBtn'), menuBackdrop=$('#menuBackdrop'), sidePanel=document.querySelector('.side');\nfunction setMobileMenu(open){if(!sidePanel)return;sidePanel.classList.toggle('open',!!open);if(menuBackdrop)menuBackdrop.classList.toggle('open',!!open);}\nif(mobileMenuBtn) mobileMenuBtn.onclick=()=>setMobileMenu(!sidePanel.classList.contains('open'));\n\nfunction expensePeriod(){return {year:Number($('#expenseYear')?.value||$('#yearSelect').value||new Date().getFullYear()),month:Number($('#expenseMonth')?.value||$('#monthSelect').value||monthNow)}}\nfunction expenseMeta(e){\n  let raw=String(e.description||e.notes||e.note||'');\n  let meta={};\n  const m=raw.match(/\\[SEIDA_EXPENSE_META\\](\\{.*?\\})\\[\\/SEIDA_EXPENSE_META\\]/);\n  if(m){try{meta=JSON.parse(m[1])}catch(_){meta={}}}\n  return {\n    type:e.expense_type||e.category||e.expense_name||e.type||meta.type||'Diğer',\n    method:e.payment_method||e.method||meta.method||'—',\n    fixed:Boolean(e.is_fixed ?? e.fixed_expense ?? meta.fixed ?? false),\n    doc:e.document_no||e.invoice_no||meta.doc||'',\n    desc:(e.description||e.notes||e.note||meta.desc||'').replace(/\\[SEIDA_EXPENSE_META\\].*?\\[\\/SEIDA_EXPENSE_META\\]/,'').trim()\n  };\n}\nfunction activeStaysForPeriod(year,month){\n  const last=new Date(year,month,0), first=new Date(year,month-1,1);\n  return state.stays.filter(s=>{\n    const sd=new Date(String(s.start_date||s.check_in_date||s.entry_date||s.created_at||'1900-01-01').slice(0,10)+'T00:00:00');\n    const endRaw=s.end_date||s.check_out_date||s.exit_date;\n    const ed=endRaw?new Date(String(endRaw).slice(0,10)+'T00:00:00'):null;\n    return sd<=last && (!ed||ed>=first);\n  });\n}\nfunction fillExpenseSelectors(){\n  const y=$('#expenseYear'); if(!y)return;\n  const current=Number($('#yearSelect').value||new Date().getFullYear());\n  const years=operationalYears().slice().sort((a,b)=>b-a);\n  y.innerHTML=years.map(v=>`<option value=\"${v}\">${v}</option>`).join('');\n  y.value=String(current); $('#expenseMonth').value=String($('#monthSelect').value||monthNow);\n}\nasync function refreshExpensePanel(){\n  const {year,month}=expensePeriod();\n  $('#expenseMsg').textContent='Yükleniyor...';\n  const {data,error}=await sb.from('expenses').select('*');\n  if(error){$('#expenseMsg').textContent='Giderler yüklenemedi: '+error.message;return}\n  state.expenses=(data||[]).filter(e=>{if(!e.expense_date)return false;const d=new Date(String(e.expense_date).slice(0,10)+'T00:00:00');return d.getFullYear()===year&&d.getMonth()+1===month});\n  $('#expenseMsg').textContent=''; renderExpensePanel();\n}\nfunction renderExpensePanel(){\n  const {year,month}=expensePeriod(), typeFilter=$('#expenseTypeFilter')?.value||'';\n  const standardTypes=['Elektrik','Su','Doğalgaz','Temizlik','Bakım','Onarım','Personel','İnternet','Vergi / Harç','Sarf Malzeme','Demirbaş Alımı','İnşaat'];\n  const list=state.expenses.filter(e=>{\n    const t=expenseMeta(e).type;\n    if(!typeFilter) return true;\n    if(typeFilter==='__custom__') return !standardTypes.includes(t);\n    return t===typeFilter;\n  }).sort((a,b)=>String(b.expense_date||'').localeCompare(String(a.expense_date||'')));\n  const total=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);\n  const fixed=state.expenses.reduce((s,e)=>s+(expenseMeta(e).fixed?Number(e.amount||0):0),0), variable=Math.max(0,total-fixed);\n  const people=activeStaysForPeriod(year,month).length, per=people?total/people:0;\n  const paid=state.accruals.filter(a=>Number(a.accrual_year)===year&&Number(a.accrual_month)===month).reduce((s,a)=>s+paymentForAccrual(a.id),0);\n  const profit=paid-total;\n  $('#expenseSummary').innerHTML=`<div class=\"expenseStat\"><small>TOPLAM TAHSİLAT</small><strong>${fmt(paid)}</strong></div><div class=\"expenseStat\"><small>TOPLAM GİDER</small><strong>${fmt(total)}</strong></div><div class=\"expenseStat\"><small>SABİT GİDER</small><strong>${fmt(fixed)}</strong></div><div class=\"expenseStat\"><small>DEĞİŞKEN GİDER</small><strong>${fmt(variable)}</strong></div><div class=\"expenseStat\"><small>KİŞİ BAŞI MALİYET (${people} KİŞİ)</small><strong>${fmt(per)}</strong></div><div class=\"expenseStat ${profit>=0?'profit':'loss'}\"><small>NET KÂR / ZARAR</small><strong>${fmt(profit)}</strong></div>`;\n  $('#expenseRows').innerHTML=list.length?list.map(e=>{const m=expenseMeta(e);return `<tr><td>${trDate(e.expense_date)}</td><td>${m.type}</td><td>${m.desc||'—'}</td><td><span class=\"expenseTypeBadge ${m.fixed?'fixedBadge':''}\">${m.fixed?'Sabit':'Değişken'}</span></td><td>${paymentMethodText(m.method)}</td><td>${m.doc||'—'}</td><td class=\"num\"><b>${fmt(e.amount)}</b></td></tr>`}).join(''):'<tr><td colspan=\"7\" style=\"text-align:center;color:#9fb2c6;padding:22px\">Bu dönem için gider kaydı yok.</td></tr>';\n}\nasync function openExpensePanel(){fillExpenseSelectors();await refreshExpensePanel()}\nfunction openExpenseEntry(){\n  $('#expenseDate').value=new Date().toISOString().slice(0,10); $('#expenseAmount').value=''; $('#expenseDescription').value=''; $('#expenseDocumentNo').value=''; $('#expenseFixed').value='0';\n  $('#expenseType').value='Elektrik'; $('#expenseCustomType').value=''; $('#expenseCustomTypeWrap').style.display='none';\n  $('#expenseEntryMsg').textContent=''; $('#expenseEntryModal').classList.add('open');\n}\nasync function saveExpenseEntry(){\n  const amount=Number($('#expenseAmount').value||0), date=$('#expenseDate').value, selectedType=$('#expenseType').value, method=$('#expenseMethod').value, fixed=$('#expenseFixed').value==='1', doc=$('#expenseDocumentNo').value.trim(), desc=$('#expenseDescription').value.trim();\n  const customType=$('#expenseCustomType')?.value.trim()||'';\n  const type=selectedType==='__custom__'?customType:selectedType;\n  if(!date||amount<=0){$('#expenseEntryMsg').textContent='Gider tarihi ve tutarı giriniz.';return}\n  if(!type){$('#expenseEntryMsg').textContent='Yeni gider adını giriniz.';return}\n\n  const expenseYear=Number(String(date).slice(0,4));\n  const yearRow=(state.years||[]).find(y=>Number(y.year)===expenseYear);\n  const yearId=yearRow?.id;\n  if(!yearId){\n    $('#expenseEntryMsg').textContent=`Kayıt hatası: ${expenseYear} yılı için yıl kaydı bulunamadı.`;\n    return;\n  }\n\n  $('#expenseEntryMsg').textContent='Kaydediliyor...';\n  const meta=`[SEIDA_EXPENSE_META]${JSON.stringify({type,method,fixed,doc,desc})}[/SEIDA_EXPENSE_META]`;\n  const candidates=[\n    {year_id:yearId,expense_date:date,amount,expense_name:type,category:type,expense_type:type,payment_method:method,is_fixed:fixed,document_no:doc||null,description:desc||null,payment_status:'ODENDI'},\n    {year_id:yearId,expense_date:date,amount,expense_name:type,category:type,payment_method:method,is_fixed:fixed,invoice_no:doc||null,description:desc||null,payment_status:'ODENDI'},\n    {year_id:yearId,expense_date:date,amount,expense_name:type,category:type,description:(desc?desc+' ':'')+meta,payment_status:'ODENDI'},\n    {year_id:yearId,expense_date:date,amount,expense_name:type,category:type,description:(desc?desc+' ':'')+meta},\n    {year_id:yearId,expense_date:date,amount,expense_name:type,category:type}\n  ];\n  let lastErr=null;\n  for(const row of candidates){\n    const {error}=await sb.from('expenses').insert(row);\n    if(!error){lastErr=null;break}\n    lastErr=error;\n    if(!/column|schema cache|could not find|null value|not-null|not null|violates not-null constraint/i.test(String(error.message||''))) break;\n  }\n  if(lastErr){$('#expenseEntryMsg').textContent='Kayıt hatası: '+lastErr.message;return}\n  $('#expenseEntryMsg').textContent='Gider kaydedildi.';\n  await refreshExpensePanel(); await loadPeriodData(); renderAll();\n  setTimeout(()=>$('#expenseEntryModal').classList.remove('open'),350);\n}\nfunction printExpenseReport(){\n  const {year,month}=expensePeriod(), months=['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'], m=months[month];\n  const total=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0), fixed=state.expenses.reduce((s,e)=>s+(expenseMeta(e).fixed?Number(e.amount||0):0),0), variable=Math.max(0,total-fixed), people=activeStaysForPeriod(year,month).length, per=people?total/people:0;\n  const paid=state.accruals.filter(a=>Number(a.accrual_year)===year&&Number(a.accrual_month)===month).reduce((s,a)=>s+paymentForAccrual(a.id),0), profit=paid-total;\n  const trs=state.expenses.sort((a,b)=>String(a.expense_date||'').localeCompare(String(b.expense_date||''))).map(e=>{const x=expenseMeta(e);return `<tr><td>${trDate(e.expense_date)}</td><td>${x.type}</td><td>${x.desc||'—'}</td><td>${x.fixed?'Sabit':'Değişken'}</td><td class=\"num\">${fmt(e.amount)}</td></tr>`}).join('');\n  printableWindow(`${m} ${year} Gelir Gider ve Karlilik Raporu`,`<h1>SEİDA APART</h1><h2>${year} YILI ${m.toLocaleUpperCase('tr-TR')} AYI GELİR - GİDER VE KÂRLILIK RAPORU</h2><p class=\"sub\">Tahsilat Bazlı İşletme Maliyet ve Net Kârlılık Özeti</p><div class=\"sum\"><div><small>TOPLAM TAHSİLAT</small><b>${fmt(paid)}</b></div><div><small>TOPLAM GİDER</small><b>${fmt(total)}</b></div><div><small>NET KÂR / ZARAR</small><b>${fmt(profit)}</b></div><div><small>KİŞİ BAŞI MALİYET</small><b>${fmt(per)}</b></div></div><p><b>Aktif Konaklayan:</b> ${people} &nbsp; | &nbsp; <b>Sabit Gider:</b> ${fmt(fixed)} &nbsp; | &nbsp; <b>Değişken Gider:</b> ${fmt(variable)}</p><table><thead><tr><th>Tarih</th><th>Gider Türü</th><th>Açıklama</th><th>Yapı</th><th class=\"num\">Tutar</th></tr></thead><tbody>${trs||'<tr><td colspan=\"5\">Gider kaydı yok.</td></tr>'}</tbody></table>`);\n}\n\n\n// RAPORLAR V6.6 - AYLIK YÖNETİM ÖZETİ\nfunction reportPeriod(){return {year:Number($('#reportYear')?.value||$('#yearSelect').value||new Date().getFullYear()),month:Number($('#reportMonth')?.value||$('#monthSelect').value||monthNow)}}\nfunction fillReportSelectors(){\n  const y=$('#reportYear'),m=$('#reportMonth'); if(!y||!m)return;\n  const current=Number($('#yearSelect').value||new Date().getFullYear());\n  const years=[...new Set([current,...state.years.map(x=>Number(x.year||x.archive_year||x.value)).filter(Boolean)])].sort((a,b)=>b-a);\n  y.innerHTML=years.map(v=>`<option value=\"${v}\">${v}</option>`).join('');\n  y.value=String(current); m.value=String($('#monthSelect').value||monthNow);\n}\nasync function openReportsPanel(){fillReportSelectors();await refreshReportsPanel()}\nasync function refreshReportsPanel(){\n  const {year,month}=reportPeriod(); $(' utton></div>\n    <div class=\"managementReportTitle\">${d.year} YILI ${mn.toLocaleUpperCase('tr-TR')} AYI YÖNETİM ÖZETİ</div>\n    <div class=\"managementKpis\">\n      <div class=\"managementKpi\"><span class=\"ico\">▣</span><small>TAHAKKUK</small><strong>${fmt(d.totalAccrual)}</strong></div>\n      <div class=\"managementKpi\"><span class=\"ico\">▤</span><small>TAHSİLAT</small><strong>${fmt(d.paid)}</strong></div>\n      <div class=\"managementKpi\"><span class=\"ico\">○</span><small>ALACAK</small><strong>${fmt(d.receivable)}</strong></div>\n      <div class=\"managementKpi\"><span class=\"ico\">▥</span><small>GİDER</small><strong>${fmt(d.totalExpense)}</strong></div>\n      <div class=\"managementKpi\"><span class=\"ico\">↗</span><small>NET KALAN</small><strong>${fmt(d.net)}</strong></div>\n      <div class=\"managementKpi\"><span class=\"ico\">₺</span><small>KİŞİ BAŞI MALİYET</small><strong>${fmt(d.perPersonCost)}</strong></div>\n    </div>\n    <div class=\"managementOccupancy\"><div><span>AKTİF KONAKLAYAN</span><b>${d.stays.length}</b></div><div><span>DOLU DAİRE</span><b>${d.occupied}</b></div><div><span>BOŞ DAİRE</span><b>${d.empty}</b></div></div>\n    <div class=\"managementSections\">\n      <div class=\"managementBox blue\"><h3>TAHSİLAT ÖZETİ</h3>\n        <table class=\"managementTable\"><thead><tr><th>ÖDEME TÜRÜ</th><th class=\"num\">TUTAR (₺)</th></tr></thead><tbody><tr><td>Nakit</td><td class=\"num\">${fmt(pm.NAKIT)}</td></tr><tr><td>Banka</td><td class=\"num\">${fmt(pm.BANKA)}</td></tr><tr><td>Kredi Kartı</td><td class=\"num\">${fmt(pm.KREDI_KARTI)}</td></tr>${pm.DIGER?`<tr><td>Diğer</td><td class=\"num\">${fmt(pm.DIGER)}</td></tr>`:''}<tr><th>TOPLAM TAHSİLAT</th><th class=\"num\">${fmt(d.paid)}</th></tr></tbody></table>\n        <div class=\"managementSub\">TAHSİLAT DETAYI</div>${paymentRows?`<table class=\"managementTable\"><thead><tr><th>KONAKLAYAN</th><th>DAİRE</th><th class=\"num\">NAKİT</th><th class=\"num\">BANKA</th><th class=\"num\">KREDİ K ntReportCloseBottom').onclick=()=>$('#managementSummaryReportModal').classList.remove('open');\n}\n\n\nfunction reportMonthName(month){\n  return ['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][Number(month)]||'';\n}\nfunction reportYearsOptions(selectedYear){\n  return operationalYears().slice().sort((a,b)=>b-a).map(y=>`<option value=\"${y}\" ${Number(y)===Number(selectedYear)?'selected':''}>${y}</option>`).join('');\n}\nfunction reportMonthsOptions(selectedMonth){\n  const months=['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];\n  return months.slice(1).map((m,i)=>`<option value=\"${i+1}\" ${Number(i+1)===Number(selectedMonth)?'selected':''}>${m}</option>`).join('');\n}\nasync function loadReportPeriodData(year,month){\n  await ensureYearRecord(year);\n  const [aR,pR,eR]=await Promise.all([\n    sb.from('accruals').select('*').eq('accrual_year',Number(year)).eq('accrual_month',Number(month)),\n    sb.from('payments').select('*'),\n    sb.from('expenses').select('*')\n  ]);\n  if(!aR.error) state.accruals=aR.data||[];\n  if(!pR.error) state.payments=pR.data||[];\n  if(!eR.error){\n    state.expenses=(eR.data||[]).filter(e=>{\n      const raw=String(e.expense_date||e.date||e.created_at||'').slice(0,10);\n      if(!raw)return false;\n      const d=new Date(raw+'T00:00:00');\n      return d.getFullYear()===Number(year)&&(d.getMonth()+1)===Number(month);\n    });\n  }\n}\nfunction reportDataFor(year,month){\n  year=Number(year); month=Number(month);\n  const stays=activeStaysForPeriod(year,month);\n  const accruals=(state.accruals||[]).filter(a=>Number(a.accrual_year)===year&&Number(a.accrual_month)===month);\n  const totalAccrual=accruals.reduce((s,a)=>s+Number(a.total_amount??a.rent_amount??a.amount??0),0);\n  const paid=accruals.reduce((s,a)=>s+paymentForAccrual(a.id),0);\n  const receivable=Math.max(0,totalAccrual-paid);\n  const totalExpense=(state.expen &&state.apartments.find(x=>x.id===st.apartment_id);const amount=Number(a.total_amount??a.rent_amount??a.amount??0),p=paymentForAccrual(a.id),rem=Math.max(0,amount-p);return{apt:apt?.apartment_no||'—',name:r?residentName(r):'—',amount,paid:p,rem}}).filter(x=>x.rem>0).sort((a,b)=>b.rem-a.rem);\n  return {year,month,stays,totalAccrual,paid,receivable,totalExpense,net,perPersonCost,occupied,empty,totalApts,paymentMethods,expenseBy,residentPayments,expenseDetails,debtors};\n}\nfunction reportData(){\n  const year=Number($('#yearSelect').value||new Date().getFullYear()),month=Number($('#monthSelect').value||monthNow);\n  return reportDataFor(year,month);\n}\nfunction renderReportsPanel(){\n  if(!$('#reportPeriodTitle')) return;\n  const d=reportData(), months=['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'], mn=months[d.month];\n  $('#reportPeriodTitle').textContent=`${d.year} YILI ${mn.toLocaleUpperCase('tr-TR')} AYI YÖNETİM ÖZETİ`;\n  $('#reportKpis').innerHTML=`<div class=\"reportKpi\"><small>TAHAKKUK</small><strong>${fmt(d.totalAccrual)}</strong></div><div class=\"reportKpi\"><small>TAHSİLAT</small><strong>${fmt(d.paid)}</strong></div><div class=\"reportKpi ${d.receivable>0?'bad':''}\"><small>ALACAK</small><strong>${fmt(d.receivable)}</strong></div><div class=\"reportKpi\"><small>GİDER</small><strong>${fmt(d.totalExpense)}</strong></div><div class=\"reportKpi\"><small>NET KALAN</small><strong>${fmt(d.net)}</strong></div><div class=\"reportKpi\"><small>KİŞİ BAŞI MALİYET</small><strong>${fmt(d.perPersonCost)}</strong></div>`;\n  $('#reportOccupancy').innerHTML=`<div class=\"reportOcc\"><span>AKTİF KONAKLAYAN</span><b>${d.stays.length}</b></div><div class=\"reportOcc\"><span>DOLU DAİRE</span><b>${d.occupied}</b></div><div class=\"reportOcc\"><span>BOŞ DAİRE</span><b>${d.empty}</b></div>`;\n  const pm=d.paymentMethods;\n  $('#reportCollectionSummary').innerHTML=`<table class=\"reportMiniTable\"><thead><tr><th>ÖDEME TÜ div class=\"ymrTitle\">${d.year} YILI ${m.toLocaleUpperCase('tr-TR')} AYI YÖNETİM ÖZETİ</div>\n    <div class=\"ymrKpis\">\n      <div class=\"ymrKpi\"><span class=\"ymrIcon i1\">▣</span><small>TAHAKKUK</small><b>${fmt(d.totalAccrual)}</b></div>\n      <div class=\"ymrKpi\"><span class=\"ymrIcon i2\">▤</span><small>TAHSİLAT</small><b>${fmt(d.paid)}</b></div>\n      <div class=\"ymrKpi\"><span class=\"ymrIcon i3\">○</span><small>ALACAK</small><b>${fmt(d.receivable)}</b></div>\n      <div class=\"ymrKpi\"><span class=\"ymrIcon i4\">▥</span><small>GİDER</small><b>${fmt(d.totalExpense)}</b></div>\n      <div class=\"ymrKpi\"><span class=\"ymrIcon i5\">↗</span><small>NET KALAN</small><b>${fmt(d.net)}</b></div>\n      <div class=\"ymrKpi\"><span class=\"ymrIcon i6\">₺</span><small>KİŞİ BAŞI MALİYET</small><b>${fmt(d.perPersonCost)}</b></div>\n    </div>\n    <div class=\"ymrOcc\">\n      <div><span>AKTİF KONAKLAYAN</span><b>${d.stays.length}</b></div>\n      <div><span>DOLU DAİRE</span><b>${d.occupied}</b></div>\n      <div><span>BOŞ DAİRE</span><b>${d.empty}</b></div>\n    </div>\n    <div class=\"ymrSections\">\n      <section class=\"ymrBox blue\">\n        <h3>TAHSİLAT ÖZETİ</h3>\n        <table><thead><tr><th>ÖDEME TÜRÜ</th><th class=\"num\">TUTAR (₺)</th></tr></thead><tbody>\n          <tr><td>Nakit</td><td class=\"num\">${fmt(d.paymentMethods.NAKIT)}</td></tr>\n          <tr><td>Banka</td><td class=\"num\">${fmt(d.paymentMethods.BANKA)}</td></tr>\n          <tr><td>Kredi Kartı</td><td class=\"num\">${fmt(d.paymentMethods.KREDI_KARTI)}</td></tr>\n          <tr><th>TOPLAM TAHSİLAT</th><th class=\"num\">${fmt(d.paid)}</th></tr>\n        </tbody></table>\n        <div class=\"subt\">TAHSİLAT DETAYI (KİŞİLERE GÖRE TOPLAM)</div>\n        <table><thead><tr><th>KONAKLAYAN</th><th>DAİRE</th><th class=\"num\">NAKİT</th><th class=\"num\">BANKA</th><th class=\"num\">KREDİ KARTI</th><th class=\"num\">TOPLAM</th></tr></thead><tbody>\n          ${rp||'<tr><td colspan=\"6\">Tahsilat kaydı yok.</td></tr>'}\n          <tr><th colspan=\"2\">GENEL TOPLAM</th><th class=\"num\">${fmt(d.paymentMethods.NAKIT)}</th><th class=\"num\">${fmt(d.paymentMethods.BANKA)}</th><th class=\"num\">${fmt(d.paymentMethods.KREDI_KARTI)}</th><th class=\"num\">${fmt(d.paid)}</th></tr>\n        </tbody></table>\n      </section>\n      <section class=\"ymrBox red\">\n        <h3>GİDER ÖZETİ</h3>\n        <table><thead><tr><th>GİDER TÜRÜ</th><th class=\"num\">TUTAR (₺)</th></tr></thead><tbody>\n          ${eSum||'<tr><td colspan=\"2\">Gider kaydı yok.</td></tr>'}\n          <tr><th>TOPLAM GİDER</th><th class=\"num\">${fmt(d.totalExpense)}</th></tr>\n        </tbody></table>\n        <div class=\"subt\">GİDER DETAYI</div>\n        <table><thead><tr><th>TARİH</th><th>AÇIKLAMA</th><th class=\"num\">TUTAR (₺)</th></tr></thead><tbody>\n          ${eRows||'<tr><td colspan=\"3\">Gider kaydı yok.</td></tr>'}\n          <tr><th colspan=\"2\">GENEL TOPLAM</th><th class=\"num\">${fmt(d.totalExpense)}</th></tr>\n        </tbody></table>\n      </section>\n    </div>\n    <div class=\"ymrNote\">Bu rapor seçilen ayın tahakkuk, tahsilat, gider ve doluluk bilgilerini göstermektedir. Borçlu kişiler ayrı Borçlu Listesi raporunda gösterilir.</div>\n  </div>`;\n  printableWindow(`${m} ${d.year} Aylık Yönetim Özeti`,body);\n}\n\nfunction residentTcValue(r){\n  return r?.tc_no||r?.tc_identity_no||r?.identity_no||r?.tckn||r?.national_id||'—';\n}\nfunction contractDurationText(start,end){\n  if(!start && !end) return '—';\n  if(start && !end) return 'Süresiz';\n  const s=new Date(start+'T00:00:00'), e=new Date(end+'T00:00:00');\n  if(isNaN(s)||isNaN(e)||e<s) return '—';\n  let months=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());\n  let anchor=new Date(s); anchor.setMonth(anchor.getMonth()+months);\n  if(anchor>e){months--;anchor=new Date(s);anchor.setMonth(anchor.getMonth()+months)}\n  const days=Math.max(0,Math.round((e-anchor)/86400000));\n  if(months>=12 && months%12===0 && days<=1) return (months/12)+' Yıl';\n  if(months>0 && days>0) return months+' Ay '+days+' Gün';\n  if(months>0) return months+' Ay';\n  return Math.max(1,Math.round((e-s)/86400000)+1)+' Gün';\n}\nfunction residentListReportData(){\n  const {year,month}=reportPeriod();\n  const stays=activeStaysForPeriod(year,month);\n  const rows=stays.map(s=>{\n    const r=state.residents.find(x=>x.id===s.resident_id);\n    const a=state.apartments.find(x=>x.id===s.apartment_id);\n    if(!r) return null;\n    const c=newestRow(currentRows(state.contracts,r.id,s.id));\n    const nd=contractNotesData(c);\n    const entry=stayStartDate(s);\n    const cStart=String(c?.contract_start_date||c?.start_date||nd.start||entry||'').slice(0,10);\n    const cEnd=String(c?.contract_end_date||c?.end_date||nd.end||'').slice(0,10);\n    return {\n      name:residentName(r)||'—',\n      apt:a?.apartment_no||'—',\n      entry:entry==='—'?'':String(entry).slice(0,10),\n      tc:residentTcValue(r),\n      phone:r.phone||'—',\n      contractStart:cStart,\n      contractEnd:cEnd,\n      duration:contractDurationText(cStart,cEnd)\n    };\n  }).filter(Boolean).sort((x,y)=>{\n    const ax=Number(x.apt), ay=Number(y.apt);\n    if(Number.isFinite(ax)&&Number.isFinite(ay)&&ax!==ay) return ax-ay;\n    return String(x.name).localeCompare(String(y.name),'tr');\n  });\n  const occupied=new Set(stays.map(s=>String(s.apartment_id))).size;\n  return {year,month,rows,occupied,empty:Math.max(0,(state.apartments||[]).length-occupied)};\n}\nfunction residentListRowsHtml(rows){\n  return rows.map((x,i)=>`<tr>\n    <td class=\"center\">${i+1}</td>\n    <td>${escHtml(x.name)}</td>\n    <td class=\"center\">${escHtml(String(x.apt))}</td>\n    <td class=\"center nowrap\">${x.entry?trDate(x.entry):'—'}</td>\n    <td class=\"center nowrap\">${escHtml(String(x.tc))}</td>\n    <td class=\"center nowrap\">${escHtml(String(x.phone))}</td>\n    <td class=\"center nowrap\">${x.contractStart?trDate(x.contractStart):'—'}</td>\n    <td class=\"center nowrap\">${x.contractEnd?trDate(x.contractEnd):'—'}</td>\n    <td class=\"center nowrap\">${escHtml(x.duration)}</td>\n  </tr>`).join('');\n}\nasync function openResidentListReport(year=Number($('#yearSelect').value||new Date().getFullYear()),month=Number($('#monthSelect').value||monthNow)){\n  await loadReportPeriodData(year,month);\n  const oldY=$('#yearSelect').value,oldM=$('#monthSelect').value;$('#yearSelect').value=String(year);$('#monthSelect').value=String(month);\n  const d=residentListReportData();$('#yearSelect').value=oldY;$('#monthSelect').value=oldM;\n  const now=new Date();\n  const reportDate=now.toLocaleDateString('tr-TR')+' - '+now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});\n  $('#residentListReportBody').innerHTML=`<div class=\"residentListReportPaper\"><div class=\"reportPeriodControls\"><div><label>Yıl</label><select id=\"residentReportYear\">${reportYearsOptions(year)}</select></div><div><label>Ay</label><select id=\"residentReportMonth\">${reportMonthsOptions(month)}</select></div><button id=\"residentReportApply\">DÖNEMİ GÖSTER</button></div>\n    <div class=\"residentListReportHead\">\n      <h2>SEİDA APART</h2>\n      <h3>KONAKLAYAN LİSTESİ</h3>\n      <div class=\"residentListReportDate\">Rapor Tarihi: ${reportDate}</div>\n    </div>\n    <div class=\"residentListStats\">\n      <div class=\"residentListStat\"><small>TOPLAM KONAKLAYAN</small><b>${d.rows.length}</b></div>\n      <div class=\"residentListStat\"><small>DOLU DAİRE</small><b>${d.occupied}</b></div>\n      <div class=\"residentListStat\"><small>BOŞ DAİRE</small><b>${d.empty}</b></div>\n      <div class=\"residentListStat\"><small>RAPOR DÖNEMİ</small><b>${String(d.month).padStart(2,'0')}.${d.year}</b></div>\n    </div>\n    <div class=\"residentListTableWrap\"><table class=\"residentListTable\">\n      <thead><tr><th>SIRA</th><th>AD SOYAD</th><th>DAİRE NO</th><th>GİRİŞ TARİHİ</th><th>TC KİMLİK NO</th><th>TELEFON</th><th>KONTRAT BAŞLANGIÇ</th> ived,0),totalReturned:rows.reduce((s,x)=>s+x.returned,0),totalDeduction:rows.reduce((s,x)=>s+x.deduction,0),totalRemaining:rows.reduce((s,x)=>s+x.remaining,0)};\n}\nfunction depositRowsHtml(rows){\n  return rows.map(x=>`<tr><td class=\"center\">${x.apt}</td><td>${x.name}</td><td class=\"num\">${fmt(x.received)}</td><td class=\"center\">${x.receivedDate?trDate(x.receivedDate):'—'}</td><td class=\"num\">${fmt(x.returned)}</td><td class=\"center\">${x.returnDate?trDate(x.returnDate):'—'}</td><td class=\"num\">${fmt(x.deduction)}</td><td class=\"num\"><b>${fmt(x.remaining)}</b></td><td class=\"center\"><span class=\"depositStatus ${x.remaining>0?'open':'closed'}\">${x.status}</span></td></tr>`).join('');\n}\nasync function shareReportPdf(element,fileName,title){\n  if(!element){alert('Paylaşılacak rapor bulunamadı.');return}\n  if(typeof html2pdf==='undefined'){alert('PDF paylaşım bileşeni yüklenemedi. İnternet bağlantısını kontrol edin.');return}\n  try{\n    const opt={margin:8,filename:fileName,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}};\n    const blob=await html2pdf().set(opt).from(element).outputPdf('blob');\n    const file=new File([blob],fileName,{type:'application/pdf'});\n    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){\n      await navigator.share({title,text:title,files:[file]});\n    }else{\n      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);\n      alert('Bu tarayıcı doğrudan dosya paylaşımını desteklemiyor. PDF indirildi; cihazınızın paylaş menüsünden gönderebilirsiniz.');\n    }\n  }catch(e){if(e?.name!=='AbortError')alert('Paylaşım hazırlanamadı: '+(e?.message||e))}\n}\nfunction rentFeeReportData(){\n  const year=Number($('#yearSelect').value||new Date().getFullYear(
