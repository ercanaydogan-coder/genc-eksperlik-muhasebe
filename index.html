eduledPayments=db.scheduledPayments||[];\ndb.personnelPayments=db.personnelPayments||[];\nconst fmt=n=>(Number(n)||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' TL';const uid=()=>Date.now()+Math.random();\nfunction save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function monthOf(d){return (d||'').slice(0,7)}function cur(){return document.getElementById('period').value}\nconst mods=[['dashboard','⌂','Ana Panel','Finansal genel bakış'],['companies','◆','Sigorta Şirketleri','Cari kartlar'],['invoice','▤','Faturalar','Fatura girişleri'],['collection','●','Tahsilatlar','Tahsilat girişleri'],['personnel','♟','Personel','Maaş ve prim'],['tax','⚖','Vergiler & Resmî Ödemeler','Vergi ve resmî ödeme takibi'],['expense','▣','Ofis & Diğer Giderler','Gider girişleri'],['vehicles','🚗','Araçlar','Araç ve yakıt'],['bank','▰','Banka / Kasa / Kart','Para hareketleri'],['cost','▥','Dosya Maliyeti','Maliyet analizi'],['reports','▥','Raporlar','Yönetim raporları'],['later','♟','Kişisel Hesap','Ali Ercan Aydoğan kişisel gelir-gider'],['settings','⚙','Ayarlar','Sistem ayarları']];\nmods.forEach((m,i)=>{let b=document.createElement('button');b.innerHTML=`${m[1]} &nbsp; ${m[2]}`;if(i==0)b.className='active';b.onclick=()=>{go(m[0]);document.getElementById('pt').textContent=m[2];document.getElementById('ps').textContent=m[3];document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};nav.appendChild(b)});\nfunction go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');renderAll();if(id==='vehicles'&&typeof renderVehicles==='function')renderVehicles()}\nfunction navigateModule(id){\n const idx=mods.findIndex(m=>m[0]===id);\n go(id);\n if(idx>=0){\n   document.getElementById('pt').textContent=mods[idx][2];\n   document.getElementById('ps').textContent=mods[idx][3];\n   document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===idx));\n }\n window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction openScheduledList(source){\n const isPersonnel=String(source||'').startsWith('personnel');\n const target=isPersonnel?'personnel':(source==='tax'?'tax':'expense');\n navigateModule(target);\n setTimeout(()=>{\n   if(isPersonnel&&typeof showPersonTab==='function')showPersonTab('entitlement');\n   const box=document.getElementById(isPersonnel?'plannedPersonnelTable':(source==='tax'?'plannedTaxTable':'plannedExpenseTable'));\n   if(box){\n     const card=box.closest('.card')||box;\n     card.scrollIntoView({behavior:'smooth',block:'start'});\n     card.style.boxShadow='0 0 0 3px rgba(23,111,232,.18),0 3px 12px rgba(20,45,65,.12)';\n     setTimeout(()=>card.style.boxShadow='',1600);\n   }\n },100);\n}\nfunction setDates(){const today=new Date().toISOString().slice(0,10);['iDate','tDate','eDate','bDate','xDate'].forEach(id=>{let e=document.getElementById(id);if(e&&!e.value)e.value=today})}\n\nfunction periodLabel(ymv){\n const aylar=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];\n const a=(ymv||'2026-09').split('-'); return aylar[(+a[1]||9)-1]+' '+(a[0]||2026);\n}\n\nfunction availablePeriodYears(){\n const nowYear=new Date().getFullYear();\n const years=new Set([nowYear-2,nowYear-1,nowYear,nowYear+1,nowYear+2,nowYear+3]);\n const addDate=d=>{const y=Number(String(d||'').slice(0,4));if(y>=2000&&y<=2100)years.add(y)};\n (db.invoices||[]).forEach(x=>{addDate(x.date);addDate(x.dueDate)});\n (db.collections||[]).forEach(x=>addDate(x.date));\n (db.expenses||[]).forEach(x=>addDate(x.date));\n (db.taxPayments||[]).forEach(x=>{addDate(x.date);addDate(x.periodKey)});\n return [...years].sort((a,b)=>a-b);\n}\nfunction allPeriodOptions(){const out=[];availablePeriodYears().forEach(y=>{for(let m=1;m<=12;m++){let ym=y+'-'+String(m).padStart(2,'0');out.push({ym,label:periodLabel(ym),year:y})}});return out}\nfunction fillPeriodSelect(el,preferred){\n if(!el)return; const opts=allPeriodOptions(),wanted=preferred||el.value||new Date().toISOString().slice(0,7);let html='',last=null;\n opts.forEach(o=>{if(o.year!==last){if(last!==null)html+='</optgroup>';html+=`<optgroup label=\"${o.year}\">`;last=o.year}html+=`<option value=\"${o.ym}\">${o.label}</option>`});if(last!==null)html+='</optgroup>';\n el.innerHTML=html; const todayYM=new Date().toISOString().slice(0,7); el.value=opts.some(o=>o.ym===wanted)?wanted:(opts.some(o=>o.ym===todayYM)?todayYM:(opts[0]?.ym||''));\n}\nfunction syncAllPeriodSelectors(){const top=document.getElementById('period');fillPeriodSelect(top,top?.value||new Date().toISOString().slice(0,7))}\nfunction syncTaxPeriod(){const e=document.getElementById('xPeriod');if(!e)return;fillPeriodSelect(e,e.value||cur());}\n\n\nfunction renderExpenseCategories(){\n const s=document.getElementById('eCat'); if(!s)return;\n const base=['Kira','Elektrik','Su','İnternet','Telefon','Kırtasiye','Temizlik','Bakım/Onarım'];\n const current=s.value;\n s.innerHTML=[...base,...(db.customExpenseCategories||[])].map(v=>`<option>${v}</option>`).join('');\n if([...base,...(db.customExpenseCategories||[])].includes(current))s.value=current;\n}\nfunction toggleCustomExpenseInput(){\n const w=document.getElementById('customExpenseInline'),i=document.getElementById('customExpenseName');\n if(!w)return; w.style.display='inline-flex'; if(i){i.value='';i.focus();}\n}\nfunction closeCustomExpenseInput(){const w=document.getElementById('customExpenseInline');if(w)w.style.display='none'}\nfunction saveCustomExpenseCategory(){\n const i=document.getElementById('customExpenseName'); const name=(i?.value||'').trim();\n if(!name)return alert('Gider adı boş bırakılamaz.');\n db.customExpenseCategories=db.customExpenseCategories||[];\n const all=['Kira','Elektrik','Su','İnternet','Telefon','Kırtasiye','Temizlik','Bakım/Onarım',...db.customExpenseCategories];\n if(!all.some(x=>x.toLocaleLowerCase('tr-TR')===name.toLocaleLowerCase('tr-TR')))db.customExpenseCategories.push(name);\n save();renderExpenseCategories();const s=document.getElementById('eCat');if(s)s.value=name;closeCustomExpenseInput();\n}\n\n\nfunction showExpenseTab(name,btn){\n document.querySelectorAll('#expense .expense-tab-panel').forEach(x=>x.style.display='none');\n const ids={entry:'expenseEntryPanel',list:'expenseListPanel',monthly:'expenseMonthlyPanel',category:'expenseCategoryPanel',yearly:'expenseYearlyPanel'};\n const p=document.getElementById(ids[name]);if(p)p.style.display='block';\n document.querySelectorAll('#expenseTabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');\n renderExpenseReports();\n}\nfunction renderExpenseReports(){\n if(!document.getElementById('expenseFullTable'))return;\n const p=cur(),year=p.split('-')[0],months=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];\n const monthRows=db.expenses.filter(x=>monthOf(x.date)===p);\n const yearRows=db.expenses.filter(x=>(x.date||'').startsWith(year+'-'));\n expenseListCount.textContent=db.expenses.length+' kayıt';\n expenseFullTable.innerHTML=table(['Tarih','Kategori','Açıklama','Hesap','Tutar',''],[...db.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<tr><td>${x.date}</td><td>${x.cat}</td><td>${x.note||'-'}</td><td>${x.account}</td><td class=\"money neg\">${fmt(x.amount)}</td><td><button class=\"btn danger\" onclick=\"del('expenses',${x.id})\">Sil</button></td></tr>`));\n const cats={};monthRows.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+Number(x.amount||0));\n const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mt=monthRows.reduce((s,x)=>s+Number(x.amount||0),0);\n emTotal.textContent=fmt(mt);emCount.textContent=monthRows.length;emAvg.textContent=fmt(monthRows.length?mt/monthRows.length:0);\n emTopCat.textContent=catArr[0]?.[0]||'-';emTopCatAmount.textContent=fmt(catArr[0]?.[1]||0);\n expenseMonthlyTable.innerHTML=table(['Kategori','İşlem Sayısı','Toplam','Pay'],catArr.map(([c,v])=>`<tr><td>${c}</td><td>${monthRows.filter(x=>x.cat===c).length}</td><td class=\"money neg\">${fmt(v)}</td><td>%${mt?Math.round(v/mt*100):0}</td></tr>`));\n const cr=document.getElementById('expenseReportCategory');\n if(cr){\n   const current=cr.value||'Tümü';\n   const allCats=['Tümü','Kira','Elektrik','Su','İnternet','Telefon','Kırtasiye','Temizlik','Bakım/Onarım',...(db.customExpenseCategories||[])];\n   cr.innerHTML=[...new Set(allCats)].map(c=>`<option>${c}</option>`).join('');\n   cr.value=allCats.includes(current)?current:'Tümü';\n   const selected=cr.value;\n   const filtered=selected==='Tümü'?monthRows:monthRows.filter(x=>x.cat===selected);\n   const total=filtered.reduce((s,x)=>s+Number(x.amount||0),0);\n   if(document.getElementById('expenseReportPeriod'))expenseReportPeriod.value=periodLabel(p);\n   if(document.getElementById('expenseCategoryPeriodLabel'))expenseCategoryPeriodLabel.textContent=periodLabel(p);\n   ecName.textContent=selected;ecTotal.textContent=fmt(total);ecCount.textContent=filtered.length;ecAvg.textContent=fmt(filtered.length?total/filtered.length:0);\n   expenseCategoryTable.innerHTML=table(['Tarih','Kategori','Açıklama','Ödeme Hesabı','Tutar'],filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<tr><td>${x.date}</td><td>${x.cat}</td><td>${x.note||'-'}</td><td>${x.account}</td><td class=\"money neg\">${fmt(x.amount)}</td></tr>`));\n }\n const ym=Array.from({length:12},(_,i)=>year+'-'+String(i+1).padStart(2,'0'));\n const sums=ym.map(m=>yearRows.filter(x=>monthOf(x.date)===m).reduce((s,x)=>s+Number(x.amount||0),0));\n const yt=sums.reduce((a,b)=>a+b,0),mx=Math.max(0,...sums),mi=sums.indexOf(mx);\n eyTotal.textContent=fmt(yt);eyCount.textContent=yearRows.length;eyAvg.textContent=fmt(yt/12);eyYear.textContent=year;\n eyTopMonth.textContent=mx?months[mi]:'-';eyTopAmount.textContent=fmt(mx);\n expenseYearlyTable.innerHTML=table(['Ay','Kayıt Sayısı','Toplam Gider'],ym.map((m,i)=>`<tr><td>${month iv>\n</div>\n\n<script>\n// Araç kartları diğer mali kayıtların depolama alanını değiştirmez.\nconst VEHICLE_KEY='genc_mali_vehicle_cards_v1';\nfunction loadVehicles(){try{const x=JSON.parse(localStorage.getItem(VEHICLE_KEY));if(Array.isArray(x))return x}catch(e){}return [{plate:'61 AEA 801',brand:'',model:'',year:''},{plate:'61 EA 938',brand:'',model:'',year:''}]}\nlet vehicleCards=loadVehicles();\nfunction escapeVehicle(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nconst VEHICLE_EXPENSE_KEY='genc_mali_vehicle_expenses_v1',VEHICLE_KM_KEY='genc_mali_vehicle_km_v1';\nfunction vehicleLoad(k){try{let x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:[]}catch(e){return []}}\nlet vehicleExpenses=vehicleLoad(VEHICLE_EXPENSE_KEY),vehicleKm=vehicleLoad(VEHICLE_KM_KEY),selectedVehicle=0;\nconst vMoney=n=>(Number(n)||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' TL';\nfunction vehicleMonth(){return document.getElementById('period')?.value||new Date().toISOString().slice(0,7)}\nfunction vehicleOptions(id){let e=document.getElementById(id);if(e)e.innerHTML=vehicleCards.map((v,i)=>`<option value=\"${i}\">${escapeVehicle(v.plate)}</option>`).join('')}\nfunction vehicleLatestKm(i){return vehicleKm.filter(k=>k.plate===vehicleCards[i]?.plate).sort((a,b)=>b.period.localeCompare(a.period))[0]}\nfunction vehicleMonthlyKm(i){let a=vehicleKm.filter(k=>k.plate===vehicleCards[i]?.plate).sort((a,b)=>b.period.localeCompare(a.period));return a.length>1?Math.max(0,a[0].total-a[1].total):null}\nfunction renderVehicles(){let count=document.getElementById('vehicleCount');if(!count)return;let m=vehicleMonth(),y=m.slice(0,4);count.textContent=vehicleCards.length;let current=vehicleExpenses.filter(e=>e.date.slice(0,7)===m),annual=vehicleExpenses.filter(e=>e.date.slice(0,4)===y);document.getElementById('vMonthExpense').textContent=vMoney(current.reduce((s,e)=>s+e.amount,0));document.getElementById('vYearEx e(v.plate)}</strong><div>${escapeVehicle([v.brand,v.model].filter(Boolean).join(' ')||'Marka / model bilgisi girilmedi')}</div><span class=\"v-tag ${v.active===false?'off':''}\">${v.active===false?'Pasif':'Aktif'}</span></div><dl>${rows.map(([a,b])=>`<dt>${a}</dt><dd>${escapeVehicle(b||'—')}</dd>`).join('')}</dl>`}\nfunction selectVehicle(i){selectedVehicle=i;renderVehicles()}\nfunction toggleVehicleForm(){let e=document.getElementById('vehicleAddForm');e.hidden=!e.hidden;if(!e.hidden)document.getElementById('vehiclePlate').focus()}\nfunction persistVehicles(){localStorage.setItem(VEHICLE_KEY,JSON.stringify(vehicleCards));renderVehicles()}\nfunction addVehicle(){const plate=document.getElementById('vehiclePlate').value.trim().toLocaleUpperCase('tr-TR').replace(/\\s+/g,' ');if(!plate)return alert('Plaka giriniz.');if(vehicleCards.some(v=>v.plate===plate))return alert('Bu plaka zaten kayıtlı.');vehicleCards.push({plate,brand:vehicleBrand.value.trim(),model:vehicleModel.value.trim(),year:vehicleYear.value.trim(),active:true});selectedVehicle=vehicleCards.length-1;persistVehicles();['vehiclePlate','vehicleBrand','vehicleModel','vehicleYear'].forEach(id=>document.getElementById(id).value='');document.getElementById('vehicleAddForm').hidden=true;alert('Araç kaydedildi.')}\nfunction editVehicle(i){let v=vehicleCards[i];if(!v)return;let fields=[['brand','Marka'],['model','Model'],['year','Model yılı'],['kind','Araç türü'],['fuel','Yakıt türü'],['owner','Ruhsat sahibi'],['purpose','Kullanım amacı'],['kasko','Kasko yenileme tarihi (YYYY-AA-GG)'],['traffic','Trafik sigortası yenileme tarihi (YYYY-AA-GG)'],['inspection','Muayene tarihi (YYYY-AA-GG)'],['mtv','MTV son ödeme (YYYY-AA-GG)'],['hgs','HGS bakiyesi']];for(let [key,label] of fields){let x=prompt(label+':',v[key]||'');if(x===null)return;v[key]=x.trim()}let active=confirm('Araç aktif durumda mı? (Tamam: Aktif / İptal: Pasif)');v.active=active;persistVehicles();alert('Araç bilgileri kaydedildi.')}\nfunction openVehicleEntr period=vKmPeriod.value,total=Number(vKmTotal.value);if(!vehicleCards[i]||!period||vKmTotal.value===''||total<0)return alert('Araç, ay ve geçerli KM zorunlu.');let plate=vehicleCards[i].plate,previous=vehicleKm.filter(k=>k.plate===plate&&k.period<period).sort((a,b)=>b.period.localeCompare(a.period))[0];if(previous&&total<previous.total)return alert('Güncel KM önceki kayıttan küçük olamaz.');vehicleKm=vehicleKm.filter(k=>!(k.plate===plate&&k.period===period));vehicleKm.push({plate,period,total});localStorage.setItem(VEHICLE_KM_KEY,JSON.stringify(vehicleKm));document.getElementById('vehicleKmForm').hidden=true;renderVehicles();alert('Aylık KM kaydedildi.')}\n// V4.29: Yedek alma ve veri temizleme birbirinden bağımsızdır.\nfunction backupTestData(){\n const keys=[KEY,PKEY,PHKEY,VEHICLE_KEY,VEHICLE_EXPENSE_KEY,VEHICLE_KM_KEY];\n const backup={version:'V4.29',createdAt:new Date().toISOString(),storage:{}};\n for(const k of keys)backup.storage[k]=localStorage.getItem(k);\n const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});\n const url=URL.createObjectURL(blob),a=document.createElement('a');\n a.href=url;a.download='GENC_EKSPERLIK_TEMIZLIK_ONCESI_YEDEK.json';\n document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);\n alert('Yedek indirme işlemi başlatıldı. İndirilenler klasöründen dosyayı kontrol edin.');\n}\nfunction cleanTestDataSafely(){\n if(!confirm('Deneme mali kayıtları, personeller ve araç gider/KM kayıtları silinecek. Sigorta şirketleri ve araç kartları kalacak. JSON yedeğini aldınız mı?'))return;\n if(!confirm('Son onay: Deneme kayıtları kalıcı olarak silinsin mi?'))return;\n const retainedCompanies=Array.isArray(db.companies)?db.companies:[];\n const retainedVehicles=Array.isArray(vehicleCards)?vehicleCards:[];\n const cleanDb={companies:retainedCompanies,invoices:[],collections:[],expenses:[],transfers:[],taxPayments:[],scheduledPayments:[],personnelPayments:[],customExpenseCategories:[],financeAccounts:{bankName:db.financeAccounts?.bankName||'Banka',bankOpening:0,cashOpening:0,cardOpening:0}};\n try{\n  localStorage.setItem(KEY,JSON.stringify(cleanDb));\n  localStorage.setItem(PKEY,'[]');localStorage.setItem(PHKEY,'[]');\n  localStorage.setItem(VEHICLE_KEY,JSON.stringify(retainedVehicles));\n  localStorage.setItem(VEHICLE_EXPENSE_KEY,'[]');localStorage.setItem(VEHICLE_KM_KEY,'[]');\n  db=cleanDb;vehicleExpenses=[];vehicleKm=[];\n  const check=JSON.parse(localStorage.getItem(KEY));\n  if(check.invoices.length||check.collections.length||check.expenses.length||check.taxPayments.length)throw Error('Kayıt kontrolü başarısız.');\n  alert('Temizlik tamamlandı. Sigorta şirketleri ve araç kartları korundu.');location.reload();\n }catch(e){alert('Temizlik tamamlanamadı: '+e.message+' Yedek dosyanızı saklayın.')}\n}\nrenderVehicles();\n<\/script>\n\n<style>\n#companyCloudStatus{position:fixed;right:12px;bottom:12px;z-index:99999;padding:7px 11px;border-radius:16px;background:#17334c;color:white;font-size:11px;box-shadow:0 3px 14px #0003;opacity:.94}\n#companyCloudStatus.ok{background:#087a4e}#companyCloudStatus.warn{background:#9a6500}#companyCloudStatus.err{background:#b92f3c}\n</style>\n<div id=\"companyCloudStatus\" class=\"warn\">Bulut: hazırlanıyor…</div>\n<script>\n(function(){\n  const CLOUD_URL='https://uqavfzrheswwkzqrnfou.supabase.co';\n  const CLOUD_KEYS=['genc_mali_v1_real','genc_personnel_v419','genc_personnel_hakedis_v419','genc_mali_vehicle_cards_v1','genc_mali_vehicle_expenses_v1','genc_mali_vehicle_km_v1'];\n  let cloud=null, ownerId=null, lastHash='', busy=false, ready=false, pollTick=0;\n  const status=(msg,cls='warn')=>{const e=document.getElementById('companyCloudStatus');if(e){e.textContent=msg;e.className=cls}};\n  const snapshot=()=>{const o={};for(const k of CLOUD_KEYS)o[k]=localStorage.getItem(k);return o};\n  const hash=o=>JSON.stringify(Object.keys(o||{}).sort().map(k=>[k,(o||{})[k]]));\n  const apply=o=>{if(!o)return;for(const k of CLOUD_KEYS){if(Object.prototype.hasOwnProperty.call(o,k)){if(o[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,o[k]);}}};\n  async function getRow(){const r=await cloud.from('company_app_state').select('data,updated_at').eq('owner_id',ownerId).maybeSingle();if(r.error)throw r.error;return r.data}\n  async function push(){if(!ready||busy)return;busy=true;try{const data=snapshot();const r=await cloud.from('company_app_state').upsert({owner_id:ownerId,data,updated_at:new Date().toISOString()},{onConflict:'owner_id'});if(r.error)throw r.error;lastHash=hash(data);status('Bulut: senkronize','ok')}catch(e){console.error(e);status('Bulut hatası: '+(e.message||e),'err')}finally{busy=false}}\n  async function pullIfChanged(){if(!ready||busy)return;busy=true;try{const row=await getRow();if(!row)return;const remote=row.data||{}, rh=hash(remote), local=snapshot(), lh=hash(local);if(rh!==lh && lh===lastHash){apply(remote);lastHash=rh;status('Bulut: güncellendi','ok');if(!sessionStorage.getItem('company_cloud_poll_reloaded')){sessionStorage.setItem('company_cloud_poll_reloaded','1');setTimeout(()=>parent.reloadModeFrame('company'),120)}else{ready=true;status('Bulut: senkronize','ok')}}else if(rh===lh){status('Bulut: senkronize','ok')}}catch(e){console.error(e);status('Bulut hatası: '+(e.message||e),'err')}finally{busy=false}}\n  async function init(){\n    try{\n      if(!window.supabase){status('Bulut: kütüphane yüklenemedi','err');return}\n      const key=localStorage.getItem('seida_supabase_key')||'';\n      const url=localStorage.getItem('seida_supabase_url')||CLOUD_URL;\n      if(!key){status('Bulut: SEİDA bağlantı anahtarı gerekli','warn');return}\n      cloud=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:false}});\n      const {data:{session},error}=await cloud.auth.getSession();\n      if(error)throw error;\n      if(!session){status('Bulut: önce SEİDA oturumu açılmalı','warn');return}\n      ownerId=session.user.id;\n      const row=await getRow();\n      if(row && row.data){\n        const remote=row.data||{}, local=snapshot();\n        const remoteHasData=CLOUD_KEYS.some(k=>Object.prototype.hasOwnProperty.call(remote,k));\n        if(!remoteHasData){\n          const w=await cloud.from('company_app_state').upsert({owner_id:ownerId,data:local,updated_at:new Date().toISOString()},{onConflict:'owner_id'});\n          if(w.error)throw w.error;\n          lastHash=hash(local);ready=true;status('Bulut: yerel veriler yüklendi','ok');return;\n        }\n        const rh=hash(remote), lh=hash(local);\n        if(rh!==lh){apply(remote);lastHash=rh;status('Bulut: veriler alındı','ok');if(!sessionStorage.getItem('company_cloud_reloaded')){sessionStorage.setItem('company_cloud_reloaded','1');setTimeout(()=>parent.reloadModeFrame('company'),120)}else{ready=true;status('Bulut: senkronize','ok')}return}\n      }else{\n        const local=snapshot();\n        const w=await cloud.from('company_app_state').upsert({owner_id:ownerId,data:local,updated_at:new Date().toISOString()},{onConflict:'owner_id'});\n        if(w.error)throw w.error;\n      }\n      lastHash=hash(snapshot());ready=true;status('Bulut: bağlı','ok');\n      setInterval(async()=>{\n        if(!ready||busy)return;\n        const h=hash(snapshot());\n        if(h!==lastHash){await push();return}\n        pollTick++;if(pollTick%3===0)await pullIfChanged();\n      },2000);\n      window.addEventListener('focus',pullIfChanged);\n      document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullIfChanged()});\n    }catch(e){console.error(e);status('Bulut hatası: '+(e.message||e),'err')}\n  }\n  setTimeout(init,700);\n})();\n<\/script>\n</body></html>";const PERSONAL_HTML="<!doctype html><html lang=\"tr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Kişisel Hesap | Genç Eksperlik</title><style>\n:root{font-family:Arial,Helvetica,sans-serif lse{ready=true;status('Bulut: senkronize','ok')}return}\n      }else{\n        const local=snapshot();\n        const w=await cloud.from('personal_app_state').upsert({owner_id:ownerId,data:local,updated_at:new Date().toISOString()},{onConflict:'owner_id'});\n        if(w.error)throw w.error;\n      }\n      lastHash=hash(snapshot());ready=true;status('Bulut: bağlı','ok');\n      setInterval(async()=>{\n        if(!ready||busy)return;\n        const h=hash(snapshot());\n        if(h!==lastHash){await push();return}\n        pollTick++;if(pollTick%3===0)await pullIfChanged();\n      },2000);\n      window.addEventListener('focus',pullIfChanged);\n      document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullIfChanged()});\n    }catch(e){console.error(e);status('Bulut hatası: '+(e.message||e),'err')}\n  }\n  setTimeout(init,700);\n})();\n<\/script>\n</body></html>\n";

ssList.toggle('hiddenView',view!=='reports');\n\n  if(view==='apartments') renderApartmentManagement();\n  if(view==='residents') renderResidents();\n  if(view==='accruals') openAccrualPanel();\n  if(view==='payments') openPaymentPanel();\n  if(view==='expenses') openExpensePanel();\n  if(view==='reports') openReportsPanel();\n}\n\n\nfunction rentForStay(st){\n  const rr=newestRow(currentRows(state.rentRates,st.resident_id,st.id))||{};\n  return Number(rr.rent_amount ?? rr.monthly_rent ?? rr.monthly_amount ?? rr.amount ?? 0);\n}\nfunction feeForStay(st){\n  const rr=newestRow(currentRows(state.rentRates,st.resident_id,st.id))||{};\n  const direct=rr.fee_amount ?? rr.monthly_fee;\n  if(direct!==undefined && direct!==null && direct!=='') return Math.max(0,Number(direct||0));\n  const c=newestRow(currentRows(state.contracts,st.resident_id,st.id));\n  const nd=contractNotesData(c);\n  return Math.max(0,Number(c?.fee_amount ?? nd.fee ?? 0));\n}\nfunction splitCollection(st,totalPaid){\n  const total=Math.max(0,rentForStay(st)), fee=Math.min(total,Math.max(0,feeForStay(st))), net=Math.max(0,total-fee), paid=Math.max(0,Number(totalPaid||0));\n  const feePaid=Math.min(paid,fee), rentPaid=Math.min(Math.max(0,paid-fee),net);\n  return {total,fee,net,paid,feePaid,rentPaid,feeRemain:Math.max(0,fee-feePaid),rentRemain:Math.max(0,net-rentPaid),remain:Math.max(0,total-paid)};\n}\nfunction accrualPanelPeriod(){\n  return {year:Number($('#accrualYear')?.value||$('#yearSelect').value||new Date().getFullYear()),month:Number($('#accrualMonth')?.value||$('#monthSelect').value||monthNow)};\n}\nfunction fillAccrualPeriodSelectors(){\n  const ay=$('#accrualYear'),am=$('#accrualMonth'); if(!ay||!am)return;\n  const years=operationalYears().slice().sort((a,b)=>b-a);\n  const selected=Number($('#yearSelect').value||new Date().getFullYear());\n  ay.innerHTML=years.map(y=>`<option value=\"${y}\">${y}</option>`).join('');\n  if([...ay.options].some(o=>Number(o.value)===selected)) ay.value=String(selected);\n  am.value=$('#monthSelect').value||String(monthNow);\n}\nasync function openAccrualPanel(){\n  fillAccrualPeriodSelectors();\n  await refreshAccrualPanel();\n}\nasync function refreshAccrualPanel(){\n  const {year,month}=accrualPanelPeriod();\n  $('#accrualMsg').textContent='Yükleniyor...';\n  const [aR,pR]=await Promise.all([sb.from('accruals').select('*').eq('accrual_year',year).eq('accrual_month',month),sb.from('payments').select('*')]);\n  if(aR.error){$('#accrualMsg').textContent='Tahakkuk okuma hatası: '+aR.error.message;return}\n  state.accruals=aR.data||[]; if(!pR.error)state.payments=pR.data||[];\n  renderAccrualPanel(); $('#accrualMsg').textContent='';\n}\nfunction renderAccrualPanel(){\n  const body=$('#accrualRows'),sum=$('#accrualSummary'); if(!body||!sum)return;\n  const q=($('#accrualSearch')?.value||'').trim().toLocaleLowerCase('tr-TR');\n  let total=0,paid=0,count=0; const rows=[];\n  activeStays().forEach(st=>{\n    const r=state.residents.find(x=>x.id===st.resident_id),a=state.apartments.find(x=>x.id===st.apartment_id);\n    if(!r)return; const name=residentName(r); const hay=(name+' '+(a?.apartment_no||'')).toLocaleLowerCase('tr-TR'); if(q&&!hay.includes(q))return;\n    const ac=state.accruals.find(x=>x.stay_id===st.id); const rent=rentForStay(st); const amount=Number(ac?.total_amount ?? ac?.rent_amount ?? ac?.amount ?? 0); const p=ac?paymentForAccrual(ac.id):0; const rem=Math.max(amount-p,0);\n    total+=amount;paid+=p;count++;\n    let cls='none',label='TAHAKKUK YOK'; if(ac){if(amount>0&&p>=amount){cls='paid';label='ÖDENDİ'}else if(p>0){cls='partial';label='KISMİ'}else{cls='debt';label='BEKLİYOR'}}\n    rows.push(`<tr><td><b>Daire ${a?.apartment_no||'—'}</b><div class=\"accrualSub\">${a?.floor_name||''}</div></td><td><div class=\"accrualResident\">${name}</div><div class=\"accrualSub\">Ödeme günü: ${newestRow(currentRows(state.rentRates,r.id,st.id))?.payment_day||'—'}</div></td><td class=\"num\">${fmt(rent)}</td><td class=\"num\"> ||x.stay_id===s?.id); if(!c){alert('Önce kira sözleşmesi oluşturulmalıdır.');return;} openContractDocument(r.id,c.id,true);};\n\n  $('#residentDetailModal').classList.add('open');\n}\n\n\n\nfunction currentRows(rows,residentId,stayId){\n  const byStay=(rows||[]).filter(x=>String(x.stay_id||'')===String(stayId||''));\n  if(byStay.length) return byStay;\n  return (rows||[]).filter(x=>String(x.resident_id||'')===String(residentId||''));\n}\nfunction newestRow(rows){\n  const arr=[...(rows||[])];\n  const time=x=>Date.parse(x?.updated_at||x?.created_at||x?.effective_date||x?.valid_from||x?.start_date||0)||0;\n  return arr.sort((a,b)=>time(b)-time(a))[0]||null;\n}\nfunction contractNotesData(c){\n  const n=String(c?.notes||'');\n  const get=k=>{const m=n.match(new RegExp('(?:^|\\\\|)'+k+'=([^|]*)'));return m?m[1].trim():''};\n  return {\n    rent:get('KIRA'), fee:get('AIDAT'), deposit:get('DEPOZITO'), start:get('BASLANGIC'), end:get('BITIS'),\n    landlord:get('KIRAYA_VEREN'), bank:get('BANKA'), iban:get('IBAN'), holder:get('HESAP_SAHIBI'), paymentDay:get('ODEME_GUNU'),\n    depositReceivedDate:get('DEPOZITO_ALIM_TARIHI'), depositMethod:get('DEPOZITO_YONTEM'), depositNote:get('DEPOZITO_NOT'),\n    depositReturnDate:get('DEPOZITO_IADE_TARIHI'), depositReturnAmount:get('DEPOZITO_IADE_TUTAR'),\n    depositDeduction:get('DEPOZITO_KESINTI'), depositReturnMethod:get('DEPOZITO_IADE_YONTEM'), depositReturnNote:get('DEPOZITO_IADE_NOT')\n  };\n}\nfunction depositNotesData(c){const d=contractNotesData(c);return {received:Number(d.deposit||c?.deposit_amount||0),receivedDate:d.depositReceivedDate||'',method:d.depositMethod||'',note:d.depositNote||'',returnDate:d.depositReturnDate||'',returned:Number(d.depositReturnAmount||0),deduction:Number(d.depositDeduction||0),returnMethod:d.depositReturnMethod||'',returnNote:d.depositReturnNote||''}}\nfunction mergeContractNoteField(notes,key,value){\n  let n=String(notes||''); const re=new RegExp('(^|\\\\|)'+key+'=[^|]*');\n  const token=key+'='+(value??'');\n  if(re.test(n)) return n.replace(re,(m,p1)=>p1+token);\n  return n+(n&&!n.endsWith('|')?'|':'')+token;\n}\nfunction buildContractNotes({rent,fee,deposit,start,end,landlord,bank,iban,holder,paymentDay,aptNo}){\n  return `KIRA=${rent||0}|AIDAT=${fee||0}|DEPOZITO=${deposit||0}|BASLANGIC=${start||''}|BITIS=${end||''}|ODEME_GUNU=${paymentDay||''}|KIRAYA_VEREN=${landlord||''}|BANKA=${bank||''}|IBAN=${iban||''}|HESAP_SAHIBI=${holder||''}|DAIRE=${aptNo||''}`;\n}\nfunction openContractFlow(residentId){\n  const r=state.residents.find(x=>x.id===residentId);\n  const s=getResidentStay(residentId);\n  if(!r || !s) return;\n  const rr=newestRow(currentRows(state.rentRates,residentId,s.id));\n  const c=newestRow(currentRows(state.contracts,residentId,s.id));\n  const nd=contractNotesData(c);\n  $('#contractFlowTitle').textContent=(residentName(r)||'Konaklayan')+' · Kira ve Sözleşme';\n  $('#contractFlowSave').dataset.residentId=residentId;\n  $('#cfRentAmount').value=rr?.rent_amount ?? rr?.monthly_rent ?? rr?.monthly_amount ?? rr?.amount ?? c?.monthly_rent ?? nd.rent ?? 12000;\n  $('#cfPaymentDay').value=rr?.payment_day_start ?? rr?.payment_day_start ?? rr?.payment_day ?? rr?.due_day ?? nd.paymentDay ?? 5;\n  $('#cfStartDate').value=String(c?.contract_start_date||c?.start_date||nd.start||(stayStartDate(s)==='—'?'':stayStartDate(s))||'').slice(0,10);\n  $('#cfEndDate').value=String(c?.contract_end_date||c?.end_date||nd.end||'').slice(0,10);\n  $('#cfFeeAmount').value=c?.fee_amount ?? rr?.fee_amount ?? rr?.monthly_fee ?? nd.fee ?? 0;\n  $('#cfDepositAmount').value=c?.deposit_amount ?? rr?.deposit_amount ?? nd.deposit ?? 0;\n  $('#cfLandlordName').value=c?.landlord_name||nd.landlord||'ALİ ERCAN AYDOĞAN';\n  $('#cfBankName').value=c?.bank_name||nd.bank||'Akbank Trabzon Şubesi';\n  $('#cfIban').value=c?.iban||nd.iban||'TR 97 0004 6001 0088 8000 0045 49';\n  $('#cfAccountHolder').value=c?.account_holder||nd.holder||$('#cfLandlordName').value;\n  $('#contractFlowMsg').textContent='';\n  $('#residentDetailModal').classList.remove('open');\n  $('#contractFlowModal').classList.add('open');\n}\n\nasync function saveContractFlow(){\n  const residentId=$('#contractFlowSave').dataset.residentId;\n  const r=state.residents.find(x=>x.id===residentId);\n  const s=getResidentStay(residentId);\n  if(!r || !s) return;\n  const apt=state.apartments.find(a=>a.id===s.apartment_id);\n  const activeYear=(state.years||[]).find(y=>y.is_active===true)\n    || (state.years||[]).find(y=>String(y.year)===String($('#yearSelect')?.value||''))\n    || (state.years||[])[0];\n  const contractYearId=s.year_id || activeYear?.id || null;\n\n  const rent=Number($('#cfRentAmount').value||0);\n  const fee=Number($('#cfFeeAmount').value||0);\n  const payDay=Number($('#cfPaymentDay').value||5);\n  const start=$('#cfStartDate').value||null;\n  const end=$('#cfEndDate').value||null;\n  const deposit=Number($('#cfDepositAmount').value||0);\n  const landlordInput=$('#cfLandlordName').value.trim()||null;\n  const bankInput=$('#cfBankName').value.trim()||null;\n  const ibanInput=$('#cfIban').value.trim()||null;\n  const holderInput=$('#cfAccountHolder').value.trim()||null;\n  const notesFull=buildContractNotes({rent,fee,deposit,start,end,landlord:landlordInput,bank:bankInput,iban:ibanInput,holder:holderInput,paymentDay:payDay,aptNo:apt?.apartment_no||''});\n\n  if(!rent || !start){\n    $('#contractFlowMsg').textContent='Aylık kira ve başlangıç tarihi zorunludur.';\n    return;\n  }\n  if(!contractYearId){\n    $('#contractFlowMsg').textContent='Sözleşme yılı bulunamadı. Önce aktif yılı seçin.';\n    return;\n  }\n\n  $('#contractFlowMsg').textContent='Kira ve sözleşme kaydı hazırlanıyor...';\n\n  const matchingRents=currentRows(state.rentRates,r.id,s.id);\n  const existingRent=newestRow(matchingRents);\n\n  // rent_rates tablosunun mevcut Supabase şemasına uyumlu alan adını bulup kaydet.\n  // Önce en olası mevcut şemalar denenir; başarısız denemeler ana programı durdurmaz.\n  const rentCandidates=[\n    {resident_id:r.id,stay_id:s.id,monthly_rent:rent,monthly_fee:fee,deposit_amount:deposit,payment_day_start:payDay,payment_day_end:payDay,valid_from:start,is_active:true},\n    {resident_id:r.id,stay_id:s.id,monthly_rent:rent,monthly_fee:fee,deposit_amount:deposit,payment_day_start:payDay,payment_day_end:payDay,valid_from:start,is_active:true},\n    {resident_id:r.id,stay_id:s.id,rent_amount:rent,payment_day:payDay,start_date:start,is_active:true},\n    {resident_id:r.id,stay_id:s.id,rent_amount:rent,effective_date:start,is_active:true},\n    {resident_id:r.id,stay_id:s.id,monthly_amount:rent,start_date:start,is_active:true},\n    {resident_id:r.id,stay_id:s.id,amount:rent,start_date:start,is_active:true}\n  ];\n\n  let rentResult=null;\n  let rentErrors=[];\n  if(existingRent){\n    // Aynı konaklama için birden fazla eski kira satırı oluşmuşsa hepsini güncelle.\n    // Böylece ilk/eski 12.000 TL satırının tekrar ekrana gelmesi engellenir.\n    for(const row of matchingRents){\n      const patch={};\n      if('rent_amount' in row) patch.rent_amount=rent;\n      else if('monthly_rent' in row) patch.monthly_rent=rent;\n      else if('monthly_amount' in row) patch.monthly_amount=rent;\n      else if('amount' in row) patch.amount=rent;\n      if('payment_day' in row) patch.payment_day=payDay;\n      else if('due_day' in row) patch.due_day=payDay;\n      if('valid_from' in row) patch.valid_from=start;\n      else if('effective_date' in row) patch.effective_date=start;\n      else if('start_date' in row) patch.start_date=start;\n      if('fee_amount' in row) patch.fee_amount=fee;\n      else if('monthly_fee' in row) patch.monthly_fee=fee;\n      if('deposit_amount' in row) patch.deposit_amount=deposit;\n      const attempt=await sb.from('rent_rates').update(patch).eq('id',row.id);\n      if(attempt.error){$('#contractFlowMsg').textContent='Kira güncelleme hatası: '+attempt.error.message;return;}\n      rentResult=attempt;\n    }\n  } else {\n    for(const payload of rentCandidates){\n      const attempt=await sb.from('rent_rates').insert(payload);\n      if(!attempt.error){ rentResult=attempt; break; }\n      rentErrors.push(attempt.error.message);\n    }\n    if(!rentResult){\n      $('#contractFlowMsg').textContent='Kira kaydı hatası: rent_rates tablo alanları mevcut programla eşleşmiyor.';\n      console.error('rent_rates denemeleri:',rentErrors);\n      return;\n    }\n  }\n\n  // Sözleşme kaydı: contract_start_date zorunludur.\n  // 'HAZIRLANIYOR' veritabanındaki contract_status_check kuralına uymadığı için artık gönderilmiyor.\n  // Yeni kayıtta önce veritabanı varsayılan status değeri kullanılır; gerekirse TASLAK/AKTIF denenir.\n  const contractBase={\n    resident_id:r.id,\n    stay_id:s.id,\n    apartment_id:s.apartment_id,\n    year_id:contractYearId,\n    contract_start_date:start\n  };\n\n  const contractDetailVariants=[\n    {\n      contract_date:new Date().toISOString().slice(0,10),\n      contract_end_date:end,\n      monthly_rent:rent,\n      fee_amount:fee,\n      deposit_amount:deposit,\n      landlord_name:$('#cfLandlordName').value.trim()||null,\n      bank_name:$('#cfBankName').value.trim()||null,\n      iban:$('#cfIban').value.trim()||null,\n      account_holder:$('#cfAccountHolder').value.trim()||null,\n      notes:notesFull\n    },\n    {\n      contract_end_date:end,\n      notes:notesFull\n    },\n    {\n      end_date:end,\n      notes:notesFull\n    },\n    {}\n  ];\n\n  const matchingContracts=currentRows(state.contracts,r.id,s.id);\n  const existingContract=newestRow(matchingContracts);\n  let cRes=null;\n\n  if(existingContract){\n    // Mevcut sözleşme varsa yeni bilgileri kaybetme: var olan sütunlara UPDATE yap.\n    const patch={};\n    if('contract_start_date' in existingContract) patch.contract_start_date=start;\n    if('contract_end_date' in existingContract) patch.contract_end_date=end;\n    else if('end_date' in existingContract) patch.end_date=end;\n    if('contract_date' in existingContract) patch.contract_date=new Date().toISOString().slice(0,10);\n    if('monthly_rent' in existingContract) patch.monthly_rent=rent;\n    if('fee_amount' in existingContract) patch.fee_amount=fee;\n    if('deposit_amount' in existingContract) patch.deposit_amount=deposit;\n    if('landlord_name' in existingContract) patch.landlord_name=landlordInput;\n    if('bank_name' in existingContract) patch.bank_name=bankInput;\n    if('iban' in existingContract) patch.iban=ibanInput;\n    if('account_holder' in existingContract) patch.account_holder=holderInput;\n    if('notes' in existingContract) patch.notes=notesFull;\n\n    for(const row of matchingContracts){\n      const rowPatch={};\n      if('contract_start_date' in row) rowPatch.contract_start_date=start;\n      if('contract_end_date' in row) rowPatch.contract_end_date=end;\n      else if('end_date' in row) rowPatch.end_date=end;\n      if('contract_date' in row) rowPatch.contract_date=new Date().toISOString().slice(0,10);\n      if('monthly_rent' in row) rowPatch.monthly_rent=rent;\n      if('fee_amount' in row) rowPatch.fee_amount=fee;\n      if('deposit_amount' in row) rowPatch.deposit_amount=deposit;\n      if('landlord_name' in row) rowPatch.landlord_name=landlordInput;\n      if('bank_name' in row) rowPatch.bank_name=bankInput;\n      if('iban' in row) rowPatch.iban=ibanInput;\n      if('account_holder' in row) rowPatch.account_holder=holderInput;\n      if('notes' in row) rowPatch.notes=notesFull;\n      cRes=await sb.from('contracts').update(rowPatch).eq('id',row.id);\n      if(cRes.error){$('#contractFlowMsg').textContent='Sözleşme güncelleme hatası: '+cRes.error.message;return;}\n    }\n  } else {\n    const contractErrors=[];\n    const statusOptions=[undefined,'TASLAK','AKTIF'];\n    outer:\n    for(const detail of contractDetailVariants){\n      for(const statusValue of statusOptions){\n        const payload={...contractBase,...detail};\n        if(statusValue!==undefined) payload.status=statusValue;\n        const attempt=await sb.from('contracts').insert(payload);\n        if(!attempt.error){ cRes=attempt; break outer; }\n        contractErrors.push(attempt.error.message);\n      }\n    }\n    if(!cRes){\n      console.error('contracts denemeleri:',contractErrors);\n      $('#contractFlowMsg').textContent='Kira kaydı oluştu; sözleşme kaydı hatası: '+(contractErrors.at(-1)||'Bilinmeyen hata');\n      return;\n    }\n  }\n\n  // Aylık kira değiştiğinde Ana Panelin kullandığı tahakkuk satırı da güncellenmelidir.\n  // rent_rates sözleşme/kiracı kartını, accruals ise Ana Panel tahakkuk ve kalan alacağı besler.\n  // Seçili aydan itibaren mevcut tahakkukları yeni kira bedeline eşitliyoruz.\n  const selectedYear=Number($('#yearSelect').value||new Date().getFullYear());\n  const selectedMonth=Number($('#monthSelect').value||monthNow);\n  const startParts=String(start||'').slice(0,10).split('-').map(Number);\n  const startPeriod=(startParts.length===3&&startParts[0]&&startParts[1]) ? startParts[0]*100+startParts[1] : 0;\n  const selectedPeriod=selectedYear*100+selectedMonth;\n  const accrualCutoff=Math.max(startPeriod||selectedPeriod,selectedPeriod);\n\n  const accrualRead=await sb.from('accruals').select('*').eq('stay_id',s.id);\n  if(accrualRead.error){\n    $('#contractFlowMsg').textContent='Kira kaydedildi; tahakkuk güncelleme hatası: '+accrualRead.error.message;\n    return;\n  }\n  for(const ar of (accrualRead.data||[])){\n    const py=Number(ar.accrual_year||0), pm=Number(ar.accrual_month||0);\n    const period=py*100+pm;\n    if(period<accrualCutoff) continue;\n    const patch={total_amount:rent};\n    if('rent_amount' in ar) patch.rent_amount=rent;\n    if('monthly_rent' in ar) patch.monthly_rent=rent;\n    if('amount' in ar && !('rent_amount' in ar) && !('monthly_rent' in ar)) patch.amount=rent;\n    const up=await sb.from('accruals').update(patch).eq('id',ar.id);\n    if(up.error){\n      $('#contractFlowMsg').textContent='Kira kaydedildi; tahakkuk güncelleme hatası: '+up.error.message;\n      return;\n    }\n  }\n\n  await loadAll();\n  $('#contractFlowMsg').textContent='Kira, sözleşme ve tahakkuk kaydı tamamlandı.';\n  $('#contractFlowModal').classList.remove('open');\n  const refreshedResident=state.residents.find(x=>x.id===residentId);\n  if(refreshedResident) openResidentDetail(refreshedResident);\n}\n\nfunction trDate(v){\n  if(!v) return '—';\n  const s=String(v).slice(0,10).split('-');\n  return s.length===3 ? `${s[2]}.${s[1]}.${s[0]}` : v;\n}\nfunction contractMonthCount(start,end){\n  if(!start||!end) return 0;\n  const a=String(start).slice(0,10).split('-').map(Number),b=String(end).slice(0,10).split('-').map(Number);\n  if(a.length!==3||b.length!==3||!a[0]||!b[0]) return 0;\n  const startKey=a[0]*12+(a[1]-1),endKey=b[0]*12+(b[1]-1);\n  return endKey<startKey?0:(endKey-startKey+1);\n}\nfunction escHtml(v){\n  return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\n}\nfunction openPrintDocument(title,bodyHtml){\n  const w=window.open('','_blank');\n  if(!w){ alert('Belge penceresi açılamadı. Tarayıcı açılır pencereye izin vermeli.'); return; }\n  w.document.write(`<!doctype html><html lang=\"tr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>${escHtml(title)}</title>\n  <style>\n    @page{size:A4;margin:10mm}\n    *{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,sans-serif;color:#111;font-size:10.8pt;line-height:1.38;background:#e7e7e7}\n    .toolbar{position:fixed;right:14px;top:14px;z-index:20;display:flex;gap:8px}.toolbar button{padding:10px 14px;font-weight:bold;border:1px solid #555;border-radius:8px;background:#fff}\n    .contractPage{width:190mm;height:277mm;margin:8mm auto;background:#fff;padding:0;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid;overflow:hidden}\n    .contractPage:last-child{break-after:auto;page-break-after:auto}\n    .contractTitle{border:1.5px solid #111;padding:9px 7px;font-weight:900;text-decoration:underline;font-size:15.5pt;margin-bottom:18px}\n    .sectionTitle{border:1.5px solid #111;text-align:center;font-weight:900;padding:7px;margin:10px 0}\n    .ctable{width:100%;border-collapse:collapse;table-layout:fixed}.ctable td,.ctable th{border:1px solid #111;padding:5px 6px;vertical-align:middle}.ctable th{font-weight:900;text-align:center}\n    .label{font-weight:800}.value{font-weight:700}.small{font-size:9.4pt;line-height:1.32}.termsTitle{text-align:center;font-weight:900;font-size:14.5pt;margin-bottom:16px}.term{margin:0 0 11px;text-align:justify;line-height:1.48}.pageNo{text-align:center;margin-bottom:12px}.signline{display:grid;grid-template-columns:1fr 1fr;gap:30mm;margin-top:28px;text-align:center;font-weight:900}\n    .signatureBox{margin-top:8px}.signatureCanvas{display:block;width:100%;height:36mm;border:1px dashed #777;background:#fff;touch-action:none}.sigControls{display:flex;justify-content:center;gap:6px;margin-top:5px}.sigControls button{font-size:9pt;padding:4px 8px}.signatureHint{font-size:8.5pt;font-weight:400;margin-top:3px}\n    .evacTitle{text-align:center;font-family:Georgia,serif;font-size:18pt;font-weight:900;margin:18mm 0 24mm}.evacRow{display:grid;grid-template-columns:55mm 5mm 1fr;margin:0 0 16mm;font-weight:800}.evacText{font-family:Georgia,serif;font-size:12.5pt;line-height:1.6;margin:8mm 0 20mm}.blankLine{display:inline-block;min-width:60mm;border-bottom:1px solid #111;height:6mm}\n    .page1 .ctable td,.page1 .ctable th{padding-top:5.5px;padding-bottom:5.5px}.page2 .term,.page3 .term{line-height:1.52;margin-bottom:12px}.page4 .term{line-height:1.58;margin-bottom:14px}\n    @media(max-width:820px){html,body{width:100%;overflow-x:hidden}body{background:#dfe3e8}.toolbar{position:sticky;top:0;right:auto;padding:8px;background:#eee;justify-content:center}.contractPage{width:calc(100vw - 12px);max-width:190m etAttribute('data-clear-sig'));if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);});});\n  })();\n  <\\/script></body></html>`);\n  w.document.close();\n}\nfunction getContractFor(residentId,contractId){\n  const s=getResidentStay(residentId);\n  return (state.contracts||[]).find(x=>String(x.id)===String(contractId))\n    || (state.contracts||[]).find(x=>x.resident_id===residentId || x.stay_id===s?.id);\n}\nfunction getEvacFor(residentId,evacId){\n  const s=getResidentStay(residentId);\n  return (state.evacuations||[]).find(x=>String(x.id)===String(evacId))\n    || (state.evacuations||[]).find(x=>x.resident_id===residentId || x.stay_id===s?.id);\n}\nfunction moneyPlain(v){\n  const n=Number(v||0); return Number.isFinite(n)?new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(n)+' TL':'—';\n}\nfunction signaturePadHtml(id){\n  return `<div class=\"signatureBox\"><canvas id=\"${id}\" class=\"signatureCanvas\" width=\"700\" height=\"220\"></canvas><div class=\"sigControls\"><button type=\"button\" data-clear-sig=\"${id}\">Temizle</button></div><div class=\"signatureHint\">Parmak, Apple Pencil veya fare ile imzalayın.</div></div>`;\n}\nfunction openContractDocument(residentId,contractId,signatureMode=false){\n  const r=state.residents.find(x=>x.id===residentId), s=getResidentStay(residentId);\n  const a=s?state.apartments.find(x=>x.id===s.apartment_id):null;\n  const c=getContractFor(residentId,contractId);\n  if(!r||!s||!c){alert('Sözleşme kaydı bulunamadı.');return;}\n  const rr=newestRow(currentRows(state.rentRates,residentId,s.id))||{};\n  const nd=contractNotesData(c);\n  const rent=Number(rr.rent_amount ?? rr.monthly_rent ?? rr.monthly_amount ?? rr.amount ?? c.monthly_rent ?? nd.rent ?? 0);\n  const fee=Number(c.fee_amount ?? rr.fee_amount ?? rr.monthly_fee ?? nd.fee ?? 0);\n  const deposit=Number(c.deposit_amount ?? rr.deposit_amount ?? nd.deposit ?? 0);\n  const start=c.contract_start_date||c.start_date||nd.start||stayStartDate(s);\n  const end=c.contract_end_date||c.end_date||nd.end||'';\n  const monthCount=contractMonthCount(start,end);\n  const totalRentLabel=monthCount?`${monthCount} AYLIK NET KİRA`:'TOPLAM NET KİRA';\n  const totalFeeLabel=monthCount?`${monthCount} AYLIK AİDAT`:'TOPLAM AİDAT';\n  const landlord=c.landlord_name||nd.landlord||'ALİ ERCAN AYDOĞAN';\n  const bank=c.bank_name||nd.bank||'Akbank Trabzon Şubesi';\n  const iban=c.iban||nd.iban||'';\n  const holder=c.account_holder||nd.holder||landlord;\n  const paymentDay=rr.payment_day??rr.due_day??Number(nd.paymentDay||5);\n  const aptNo=a?.apartment_no||'—', floor=a?.floor_name||'—';\n  const tenant=residentName(r)||'—';\n  const tenantAddress=r.address||r.residence_address||r.mother_address||'—';\n  const tc=r.tc_no||r.tc_identity_no||r.identity_no||r.tckn||'—';\n  const depositText=moneyPlain(deposit), rentText=moneyPlain(rent), feeText=moneyPlain(fee);\n  const body=`\n  <section class=\"contractPage page1\">\n    <div class=\"contractTitle\">KİRA SÖZLEŞMESİ</div>\n    <div class=\"sectionTitle\">KİRALANAN DAİRE</div>\n    <table class=\"ctable\">\n      <tr><td class=\"label\">SİTE</td><td class=\"value\">SEİDA APART</td><td class=\"label\">KAT NO</td><td class=\"value\">${escHtml(floor)}</td><td class=\"label\">DAİRE NO</td><td class=\"value\">${escHtml(aptNo)}</td></tr>\n      <tr><td class=\"label\">ADRES</td><td colspan=\"5\" class=\"value\">KALKINMA MAHALLESİ 130 NOLU SOKAK &nbsp;&nbsp; ORTAHİSAR / TRABZON</td></tr>\n      <tr><td class=\"label\">KİRALAYAN AD-SOYAD</td><td colspan=\"5\" class=\"value\">${escHtml(tenant)}</td></tr>\n    </table>\n    <table class=\"ctable\" style=\"margin-top:10px\">\n      <tr><th colspan=\"2\">KİRALAYAN BİLGİLERİ</th><th colspan=\"2\">KİRA BİLGİLERİ</th></tr>\n      <tr><td class=\"label\">TC KİMLİK NO</td><td>${escHtml(tc)}</td><td class=\"label\">1 AYLIK NET KİRA</td><td>${rentText}</td></tr>\n      <tr><td class=\"label\">TELEFON NO</td><td>${escHtml(r.phone||'—')}</td><td class=\"label\">${totalRentLabel}</td><td>${monthCount?moneyPlain(rent*monthCount):'—'}</td></tr>\n      <tr><td class=\"label\">KANUNİ İKAMETGATI</td><td>${escHtml(tenantAddress)}</td><td class=\"label\">1.AYLIK AİDAT</td><td>${feeText}</td></tr>\n      <tr><td></td><td></td><td class=\"label\">${totalFeeLabel}</td><td>${monthCount?moneyPlain(fee*monthCount):'—'}</td></tr>\n      <tr><th colspan=\"2\">YAKINLARI</th><td class=\"label\">KİRA MÜDDETİ</td><td>${start&&end?trDate(start)+' - '+trDate(end):'—'}</td></tr>\n      <tr><td class=\"label\">ANNE TEL</td><td>${escHtml(r.mother_phone||'—')}</td><td class=\"label\">KİRA BAŞLANGICI</td><td>${trDate(start)}</td></tr>\n      <tr><td class=\"label\">ANNE TC NO</td><td>—</td><td class=\"label\">KİRA BİTİMİ</td><td>${trDate(end)}</td></tr>\n      <tr><td class=\"label\">BABA TEL</td><td>${escHtml(r.father_phone||'—')}</td><td class=\"label\">BANKA ADI</td><td>${escHtml(bank)}</td></tr>\n      <tr><td class=\"label\">BABA TC NO</td><td>—</td><td class=\"label\">İBAN NO</td><td>${escHtml(iban)}</td></tr>\n      <tr><td class=\"label\">KEFİL TC NO</td><td>—</td><td class=\"label\">HESAP SAHİBİ</td><td>${escHtml(holder)}</td></tr>\n      <tr><td class=\"label\">KEFİL TEL</td><td>—</td><td class=\"label\">ÖDEME ŞEKLİ</td><td>Her ayın 01-${String(paymentDay).padStart(2,'0')} günleri arasında peşin</td></tr>\n    </table>\n    <table class=\"ctable\" style=\"margin-top:10px\"><tr><td class=\"label\">KİRALANAN YERİN ŞİMDİKİ DURUMU</td><td>EŞYALI , YENİ BOYALI KONUT</td></tr><tr><td class=\"label\">KİRALANAN YERİN KUL. AMACI/ CİNSİ</td><td>KONUT OLARAK</td></tr></table>\n    <div class=\"sectionTitle\">TESLİM ALINAN DEMİRBAŞLAR</div>\n    <table class=\"ctable small\"><tr><td>1- ALTUS MARKA BUZDOLABI 2- VESTEL MARKA 51 EKRAN LCD TV VE KUMANDASI 3-ANKESTRA ELEKTİRİKLİ İKİ GÖZLÜ OCAK 4- BÜRO SİT MARKA KIRMIZI RENKLİ ÇALIŞMA KOLTUĞU 5- YEMEK MASASI VE İKİ ADET SANDALYESİ 6- İKİ KİŞİLİK KOLTUK 7-ÇALIŞMA MASASI 8- BAZA ACILIR 9-YATAK BAŞLIĞI VE 90X190 YATAK, GİYSİ DOLAPLARI VE DİĞER KONUT DEMİRBAŞLARI ÇALIŞIR VAZİYETTE TESLİM EDİLMİŞTİR.</td></tr><tr><td>KONUT BOYALI VE TEMİZ BİR ŞEKİLDE TESLİM EDİLMİŞ VE AYNI ŞEKİLDE TESLİM ALINACAKTIR.</td></tr><tr><td>KLİMA KULLANIM TALEBİ VAR İSE EKSTRA AYLIK ………………………….. TL BEDEL İLE KULLANIM HAKKI VERİLECEKTİR.</td></tr></table>\n  </section>\n  <section class=\"contractPage page2\"><div class=\"termsTitle\">ÖZEL ŞARTLAR</div>\n    <p class=\"term\"><b>1.</b> Kiracı mecuru kısmen veya tamamen üçüncü kişilere kiralayamaz, devir ve temlik edemez, ortak alamaz, başkasının istifadesine sunamaz. Kira akdi de başkasına devir, temlik veya ciro edilemez. Kiracı mecuru terk ettiği taktirde kısmen veya tamamen başkasına işgal ettiremez. Kiracı mecuru kendisi, eşi, evlenmemiş çocukları ile birlikte ikametgâh olarak kullanacaktır. Aile kavramı yukarıda sayılanlardan ibaret olup ziyaret amaçlı olma hali dışında, kiracının yakınları bu kiracılık hakkından yararlanamazlar. Mecur, tahsis amacının dışında kullanılamayacağı gibi, işyeri, doktor ve dişçi muayenehanesi, depo, ardiye, imalat yeri olarak kullanılamaz. Keza mecurda tehlikeli, kötü kokan patlayıcı, yanıcı maddeler saklanamaz. Tüm bu hususların herhangi birinin ihlali kiralayana derhal sözleşmeyi fesih hakkı doğurur.</p>\n    <p class=\"term\"><b>2.</b> Kiracı mecuru, işbu kira sözleşmesi ile, mecurun bulunduğu apart yönetim planı, işletme planı, apart yönetim kurulu kararları, kat malikleri kurulu kararları ve konuyla ilgili her türlü kanun, nizam ve yönetmeliklere uygun olarak kullanmayı kabul ve taahhüt etmiştir. Aksine davranış, akde muhalefet sayılacaktır ve kiralayana sözleşmeyi fesih hakkı doğurur.</p>\n    <p class=\"term\"><b>3.</b> Kiracı, her yıl, hazırlanan Apartman İşletme Projesi’ne göre, Apartman Yönetim Kurulu ve/veya Kat Malikleri Kurulu tarafından kabul edilen ve Site Yönetimi tarafından yürürlüğe konulan yönetim giderlerinden, kiralanan mecura isabet eden aidat miktarını ve kiralanan mecura ait doğalgaz, sıcak ve soğuk su, klima giderlerini itiraz etmeksizin ödemekle yükümlüdür. Bunların zamanında ödenmemesi, kiralayana işbu sözleşmeyi fesih ve tahliye talebinde bulunma hakkı doğurur. Kiracı giderlerin mecurun demirbaşı olduğu iddiası ile bu giderleri ödemekten imtina edemez.</p>\n    <p class=\"term\"><b>4.</b> Kiralanan mecur, kiracıya eksiksiz ve tam olarak teslim edilmiştir. Kiracı tahliye sırasında mecuru projesine uygun, boyalı ve temiz bir şekilde, teslim aldığı gibi teslim edecektir. Mecurdaki tüm demirbaşlar, temiz ve çalışır bir durumda teslim alınmıştır. Tahliye anında da, kiracı tarafından temiz ve çalışır vaziyette teslim edilecektir. Bu durum kiralayan veya temsilcisi ile kiracı veya temsilcisi tarafından beraberce kontrol edilerek, varsa eksik ve kusurlar yazılı olarak tespit edilecek ve bu kusur ve eksiklerin düzeltim bedelleri kiracı tarafından karşılanacaktır.</p>\n    <p class=\"term\"><b>5.</b> Kiracı, mal sahibinin yazılı muvaffakatını almak şartı ile mecurun iç hacimleriyle dış cephesinde hiçbir bir değişiklik yapmadan, kiralanan mecurun dahilinde iç dekorasyon yapabilir. Ancak, bu sebep ile, tadilat sırasında veya sonradan ortaya çıkabilecek resmi, hukuki ve teknik sorunlardan tümü ile kiracı sorumludur. Bu sorunlar ve aksaklıklar dolayısı ile kiracı mal sahibinden veya Site Yönetiminden herhangi bir maddi talepte bulunamaz. Ayrıca, kiracı tarafından mecur dahilinde yapılacak tüm tadilatlar, akdin hitamında veya kiracının mecuru tahliyesinde, kiralayan rıza gösterdiği takdirde o günkü hali ile ve kullanılır şekilde bedelsiz olarak kiralayana teslim edilecektir. Ancak, kiralayan bu dekorasyonu istemediği takdirde mecur projesine uygun ilk teslim alındığı hale getirilip kiralayana teslim edilecek ve bununla ilgili olarak kiralayandan bir bedel istenmeyecektir. Kiracı, tahliyeden sonra dairenin tümüyle yeniden boyanması bedelini de ödemeyi kabul ve taahhüt eder.</p>\n  </section>\n  <section class=\"contractPage page3\"><div class=\"pageNo\">Sayfa 2 / 4</div>\n    <p class=\"term\"><b>6.</b> Kiracı Apartmanın ortak alanlarına veya kiraladığı mecurun zatına verilebilecek zararlar ile mecurla kendisine teslim edilen demirbaşların bozulma, hasar görme, kayıp edilme ve yönetime olabilecek, aylık aidat ve gider borçlarının teminatı olmak (${depositText}) depozitoyu işbu sözleşmenin imza tarihinde mal sahibi Sn. ${escHtml(landlord)}'ın ${escHtml(bank)} IBAN: ${escHtml(iban)} nolu banka hesabına nakit olarak gönderecektir. Kiracı, söz konusu depozitonun hiçbir şekil ve suretle ödemekle yükümlü olduğu kira bedellerine mahsubunu ve her nam ve suretle olursa olsun faizini talep edemez. Kiracı, vermiş olduğu depozitonun, tahliye anında sözleşmeden doğan tüm taahhütleri yerine getirmesi, demirbaşları 4. Madde hükümlerine uygun olarak teslim etmesi ve mecurla ilgili elektrik, su, doğalgaz, klima borçlarını ve aidatlarını ödemiş olduğuna dair yönetimden alacağı ait belgenin ibrazından itibaren 30 (otuz) gün içinde kendisine iade edilmesini kabul etmiştir. Zarar ziyan bedeli depozito bedelinden yüksek olduğu takdirde, kiracı, depozito miktarından fazla olan miktarı tahliyeden önce kiralayana ödemeyi kabul ve taahhüt eder. Kiracı ikameti sırasında, kendi hatasından kaynaklanan su basması, yangın, hırsızlık gibi olaylardan dolayı kiralanan mecur veya demirbaşlarında meydana gelebilecek zararı, Kiralayan ve yönetimin yapacağı tespite göre kiralayana defaten ödemekle yükümlüdür.</p>\n    <p class=\"term\"><b>7.</b> Taraflar kira akdini feshetmedikleri takdirde, kira bedeli her yıl TÜİK’in belirlediği yıllık TÜFE artış oranları çerçevesinde olacaktır. Bu husus hiçbir ihtara hacet kalmaksızın kendiliğinden yürürlüğe girer.</p>\n    <p class=\"term\"><b>8.</b> Kiracı mecurla ilgili elektrik, su, aydınlatma, ısınma, aidat ve benzeri kiracıya ve binada yaşama ait giderleri ödemeyi kabul ve taahhüt eder.</p>\n    <p class=\"term\"><b>9.</b> İşbu kira sözleşmesinin süresi dokuz ay olup; Taraflardan biri mecurun tahliyesini istediği takdirde bu durumu, kira bitim tarihinden 2 (iki) ay evvel yazılı olarak bildireceklerdir. Aksi halde kira müddeti kontrat süresi kadar daha uzamış olacağını kabul etmişlerdir. Kiracı ilk dönemin bitiminden sonraki dönemlerde ise, dönem içinde 2 ay önceden yazılı olarak bildirimde bulunmak suretiyle, tahliyesini isteyebilir. Bildirim yapılmadan tahliyelerde ise mal sahibi iade depozito bedelini etmeyeceği gibi, daireyi kiraya verdiği tarihe kadar geçen zamanda boş kaldığı günlerin kirasın depozitodan düşer, şayet depozitosu bu süre zarfında tahakkuk eden kirayı karşılamıyorsa kiracı çıkan fark bedelini kiralayana ödemek ile sorumludur.</p>\n    <p class=\"term\"><b>10.</b> Kiracı kira ve aidat bedellerini, mal sahibi Sn ${escHtml(landlord)}’ın, ${escHtml(bank)} IBAN: ${escHtml(iban)} No’lu hesabına, Her ayın 01-${String(paymentDay).padStart(2,'0')} günleri arasında peşin olarak ödeyecektir. Banka tarafından alınabilecek ücret kiradan tenzil edilemez.</p>\n    <p class=\"term\"><b>11.</b> Kira ve aidat belirlenen süre içinde ödenmemesi halinde gecikilen her ay için %5 gecikme faizi hiçbir ihtara hacet kalmaksızın tahakkuk ettirilecektir. Faizin tahakkuku Amme Alacakları Kanunundaki usul ve esaslara benzer şekilde gerçekleşeceği taraflarca kabul ve taahhüt edilmiştir. Kiracı herhangi bir ayın kira bedelini yasal süresi içinde ödemeyip, temerrüde düşmesi halinde mal sahibi tahliye davası açabileceği gibi, o kira dönemine ait diğer ayların kira bedelleri de muacceliyet keşfedecektir. Bu durumda, mal sahibi o kira döneminin tüm aylarının kira bedellerini kiracıdan talep edebilecek ve ödemediği taktirde kiracı temerrüde düşecektir. Bu durumda da mal sahibinin alacakların tahsilini, akdin feshi ile mecurun tahliyesini talep ve dava hakları doğacaktır.</p>\n  </section>\n  <section class=\"contractPage page4\"><div class=\"pageNo\">Sayfa 3 / 4</div>\n    <p class=\"term\"><b>12.</b> Kiracı, kira sözleşmesinin bitiminde mecuru tahliye isteğini bildirmişse, sözleşmenin bitim tarihinden 2 (İKİ) ay önceden itibaren kiralayan ile mutabık kalacakları zamanlarda, mecurun yeni kiracılara gösterilmesine izin verecektir.</p>\n    <p class=\"term\"><b>13.</b> Taraflar ve varsa müşterek borçlu ve müteselsil kefil, bu sözleşmede yer alan tüm hususların yerine getirilebilmesi ve gerekli tebligatın yapılabilmesi için, bu sözleşmenin 1. Sayfasında yazılı kiralanan yere ait ikametgah ve/veya iş adreslerinin, müşterek borçlu ve müteselsil kefil de aşağıda isminin yanında yazılı adresinin kanuni ikametgahları ve tebligat adresleri olduğunu beyan ve bu adreslere yapılacak tebligatın kendilerine yapılmış sayılacağını kabul ederler. Taraflar veya müşterek borçlu ve müteselsil kefil, bu adreslerinde bir değişiklik olduğu takdirde, yeni adreslerini, yazılı olarak diğer taraflara bildirmeyi, aksi takdirde, bu sözleşmede belirtilen adreslerine yapılacak tebligata hiçbir itirazları olmayacağını ve tebliğ edilemeden geri dönse bile bu tebligatın geçerli ve kendilerine yapılmış sayılacağını kabul ederler.</p>\n    <p class=\"term\"><b>14.</b> Taraflar, kanunen caiz olsa dahi, şahit beyanına itibar etmemeyi, her türlü ihtar, tebliğ, beyan ve karşı tarafı temerrüde düşürücü mahiyetteki hususların mutlaka yazılı olması esasını kabul etmişlerdir. Kiracı ve mal sahibinin memur ve müstahdemlerinden birine veya aynı çatı altındaki bir yakınına yapılacak tebligatlar geçerli sayılacaktır. Kiracı ile mal sahibi arasında doğabilecek her türlü ihtilafın halinde Trabzon Vilayeti Mahkeme ve İcra Dairelerinin yetkisi kabul edilmiştir.</p>\n    <p class=\"term\"><b>15.</b> Kullanıma sunulan Ampul, piller, duş sifonu ve başlığı vb malzemelerin değişimi kiracıya aittir.</p>\n    <p class=\"term\"><b>16.</b> İşbu sözleşme taraflarca sözleşme serbesti ve irade özgürlüğü içinde tek taraflı olarak değiştirilmemek kayıt ve şartıyla ve her hükmüne uyulmak gayesiyle, taraflarca tanzim olunmuş 4 sayfa ve 16 (on altı) madde 2 nüsha olarak bir bütün halinde ${trDate(start)} tarihinde imza altına alınmıştır. Bir hükmüne riayetsizlik Aktin tamamının ihlali anlamını taşır. Öte yandan, bir tarafın Aktin bir hükmüne veya şartına riayetsizliğine veya uymamasına diğer tarafın zamanla göz yummuş olması, o hükmün veya şartın kaldırılmış olduğunu tazammun etmez. Sözleşmede hükmü bulunmayan hususlarda Mer'i Kira Kanunu, Borçlar Kanunu ve sair ilgili mevzuat hükümleri geçerlidir.</p>\n    <div class=\"signline\"><div>KİRACI<br>${escHtml(tenant)}${signatureMode?signaturePadHtml('sigTenant'):''}</div><div>KİRAYA VEREN<br>${escHtml(landlord)}${signatureMode?signaturePadHtml('sigLandlord'):''}</div></div>\n  </section>\n  <section class=\"contractPage\">\n    <div class=\"evacTitle\">TAHLİYE TAAHHÜTNAMESİ</div>\n    <div class=\"evacRow\"><div>TAAHHÜT EDEN(KİRACI)</div><div>:</div><div>${escHtml(tenant)}</div></div>\n    <div class=\"evacRow\"><div>MAL SAHİBİ (KİRALAYAN)</div><div>:</div><div><u>${escHtml(landlord)}</u></div></div>\n    <div class=\"evacRow\"><div>TAHLİYE EDİLECEK<br>MECURUN ADRESİ</div><div>:</div><div>Kalkınma Mahallesi 130 nolu sokak ${escHtml(floor)}, ${escHtml(aptNo)} Nolu Daire<br><br>Ortahisar / Trabzon</div></div>\n    <div class=\"evacRow\"><div>TAHLİYE TARİHİ</div><div>:</div><div><span class=\"blankLine\"></span></div></div>\n    <div class=\"evacText\">Halen kiracı olarak kullanmakta olduğum yukarıda yazılı adresteki taşınmazı hiçbir ihtar ve ihbara gerek kalmadan kayıtsız ve şartsız olarak daireyi teslim edeceğimi kabul ve taahhüt ederim.</div>\n    <div class=\"evacRow\"><div>TAAHHÜT TARİHİ</div><div>:</div><div><span class=\"blankLine\"></span></div></div>\n    <div class=\"evacRow\"><div>TAAHHÜT EDEN</div><div>:</div><div>${escHtml(tenant)}</div></div>\n    <div class=\"evacRow\"><div>İMZASI</div><div>:</div><div>${signatureMode?signaturePadHtml('sigEvacTenant'):''}</div></div>\n  </section>`;\n  openPrintDocument(`${residentName(r)} - Kira Sözleşmesi`,body);\n}\nfunction openEvacuationDocument(residentId,evacId,signatureMode=false){\n  const s=getResidentStay(residentId);\n  const c=(state.contracts||[]).find(x=>x.resident_id===residentId||x.stay_id===s?.id);\n  if(!c){alert('Önce kira sözleşmesi oluşturulmalıdır.');return;}\n  openContractDocument(residentId,c.id,signatureMode);\n}\n\nfunction openEvacuationFlow(residentId){\n  const r=state.residents.find(x=>x.id===residentId);\n  const s=getResidentStay(residentId);\n  if(!r||!s) return;\n  const existing=(state.evacuations||[]).find(x=>x.resident_id===residentId||x.stay_id===s.id);\n  const contract=(state.contracts||[]).find(x=>x.resident_id===residentId||x.stay_id===s.id);\n  $('#evacuationFlowTitle').textContent=(residentName(r)||'Konaklayan')+' · Tahliye Taahhütnamesi';\n  $('#evacuationFlowSave').dataset.residentId=residentId;\n  $('#efCommitmentDate').value=String(existing?.commitment_date||new Date().toISOString().slice(0,10)).slice(0,10);\n  $('#efEvacuationDate').value=String(existing?.evacuation_date||contract?.contract_end_date||contract?.end_date||'').slice(0,10);\n  $('#efNotes').value=existing?.notes||'';\n  $('#evacuationFlowMsg').textContent='';\n  $('#residentDetailModal').classList.remove('open');\n  $('#evacuationFlowModal').classList.add('open');\n}\nasync function saveEvacuationFlow(){\n  const residentId=$('#evacuationFlowSave').dataset.residentId;\n  const r=state.residents.find(x=>x.id===residentId), s=getResidentStay(residentId);\n  if(!r||!s) return;\n  const commitment=$('#efCommitmentDate').value||null;\n  const evacuation=$('#efEvacuationDate').value||null;\n  const notes=$('#efNotes').value.trim()||null;\n  if(!commitment||!evacuation){\n    $('#evacuationFlowMsg').textContent='Taahhüt tarihi ve tahliye tarihi zorunludur.';\n    return;\n  }\n  const activeYear=(state.years||[]).find(y=>y.is_active===true)\n    || (state.years||[]).find(y=>String(y.year)===String($('#yearSelect')?.value||''))\n    || (state.years||[])[0];\n  const yearId=s.year_id||activeYear?.id||null;\n  const existing=(state.evacuations||[]).find(x=>x.resident_id===residentId||x.stay_id===s.id);\n  $('#evacuationFlowMsg').textContent='Tahliye taahhüdü kaydediliyor...';\n\n  if(existing){\n    const patch={};\n    if('commitment_date' in existing) patch.commitment_date=commitment;\n    if('evacuation_date' in existing) patch.evacuation_date=evacuation;\n    if('notes' in existing) patch.notes=notes;\n    const res=await sb.from('evacuation_commitments').update(patch).eq('id',existing.id);\n    if(res.error){$('#evacuationFlowMsg').textContent='Tahliye taahhüdü güncelleme hatası: '+res.error.message;return;}\n  } else {\n    const bases=[\n      {resident_id:r.id,stay_id:s.id,apartment_id:s.apartment_id,year_id:yearId,commitment_date:commitment,evacuation_date:evacuation,notes:notes},\n      {resident_id:r.id,stay_id:s.id,commitment_date:commitment,evacuation_date:evacuation,notes:notes},\n      {resident_id:r.id,stay_id:s.id,commitment_date:commitment,evacuation_date:evacuation},\n    ];\n    const errors=[];\n    let ok=null;\n    outerEv:\n    for(const base of bases){\n      for(const statusValue of [undefined,'TASLAK','AKTIF']){\n        const payload={...base};\n        if(statusValue!==undefined) payload.status=statusValue;\n        const res=await sb.from('evacuation_commitments').insert(payload);\n        if(!res.error){ok=res;break outerEv;}\n        errors.push(res.error.message);\n      }\n    }\n    if(!ok){\n      console.error('evacuation_commitments denemeleri:',errors);\n      $('#evacuationFlowMsg').textContent='Tahliye taahhüdü kayıt hatası: '+(errors.at(-1)||'Bilinmeyen hata');\n      return;\n    }\n  }\n  await loadAll();\n  $('#evacuationFlowModal').classList.remove('open');\n  const refreshedResident=state.residents.find(x=>x.id===residentId);\n  if(refreshedResident) openResidentDetail(refreshedResident);\n}\n\n\n\nfunction fillEditApartmentOptions(currentApartmentId){\n  const sel=$('#erApartment');\n  sel.innerHTML='';\n  state.apartments\n    .filter(a=>a.is_active!==false && Number(a.apartment_no)>=1 && Number(a.apartment_no)<=21)\n    .sort((a,b)=>Number(a.apartment_no)-Number(b.apartment_no))\n    .forEach(a=>{\n      const st=apartmentStatus(a.id);\n      const isCurrent=a.id===currentApartmentId;\n      const free=Math.max(Number(a.capacity||0)-st.occ,0);\n      const o=document.createElement('option');\n      o.value=a.id;\n      o.textContent=`Daire ${a.apartment_no} · ${a.floor_name} · ${st.occ}/${a.capacity} dolu`;\n      o.disabled=!isCurrent && free<=0;\n      if(isCurrent) o.selected=true;\n      sel.appendChild(o);\n    });\n}\n\nfunction openResidentEditorById(residentId){\n  const r=state.residents.find(x=>x.id===residentId);\n  if(!r) return;\n  const s=getResidentStay(r.id);\n  $('#residentDetailModal').classList.remove('open');\n\n  $('#editResidentTitle').textContent=(residentName(r)||'Konaklayan')+' · Düzenle';\n  $('#editResidentSave').dataset.residentId=r.id;\n  $('#erFirstName').value=r.first_name||'';\n  $('#erLastName').value=r.last_name||'';\n  $('#erGender').value=r.gender||'';\n  $('#erBirthDate').value=r.birth_date||'';\n  $('#erPhone').value=r.phone||'';\n  $('#erEmail').value=r.email||'';\n  $('#erMotherName').value=r.mother_name||'';\n  $('#erMotherPhone').value=r.mother_phone||'';\n  $('#erMotherAddress').value=r.mother_address||'';\n  $('#erFatherName').value=r.father_name||'';\n  $('#erFatherPhone').value=r.father_phone||'';\n  $('#erFatherAddress').value=r.father_address||'';\n  $('#erEmergencyRelation').value=r.emergency_contact_relation||'';\n  $('#erEmergencyPhone').value=r.emergency_contact_phone||'';\n  fillEditApartmentOptions(s?.apartment_id||'');\n  $('#erStartDate').value=stayStartDate(s)==='—'?'':stayStartDate(s);\n  const rr=newestRow(currentRows(state.rentRates,r.id,s?.id));\n  const c=newestRow(currentRows(state.contracts,r.id,s?.id));\n  const nd=contractNotesData(c);\n  $('#erRentAmount').value=rr?.rent_amount ?? rr?.monthly_rent ?? rr?.monthly_amount ?? rr?.amount ?? c?.monthly_rent ?? nd.rent ??     father_name:$('#erFatherName').value.trim()||null,\n    father_phone:$('#erFatherPhone').value.trim()||null,\n    father_address:$('#erFatherAddress').value.trim()||null,\n    emergency_contact_relation:$('#erEmergencyRelation').value.trim()||null,\n    emergency_contact_phone:$('#erEmergencyPhone').value.trim()||null\n  };\n\n  const {error:rErr}=await sb.from('residents').update(residentPayload).eq('id',residentId);\n  if(rErr){\n    $('#editResidentMsg').textContent='Konaklayan güncelleme hatası: '+rErr.message;\n    return;\n  }\n\n  const stayPayload={apartment_id:apartmentId};\n  if($('#erStartDate').value) stayPayload.start_date=$('#erStartDate').value;\n\n  let {error:sErr}=await sb.from('stays').update(stayPayload).eq('id',s.id);\n  if(sErr && $('#erStartDate').value){\n    // Older test records may use a different date column. Retry only the apartment change.\n    const retry=await sb.from('stays').update({apartment_id:apartmentId}).eq('id',s.id);\n    sErr=retry.error;\n  }\n  if(sErr){\n    $('#editResidentMsg').textContent='Konaklama güncelleme hatası: '+sErr.message;\n    return;\n  }\n\n  // Kira / aidat / depozito bilgilerini mevcut Supabase kayıtlarıyla aynı kaynağa yaz.\n  const rent=Number($('#erRentAmount').value||0), fee=Number($('#erFeeAmount').value||0), payDay=Number($('#erPaymentDay').value||5), deposit=Number($('#erDepositAmount').value||0);\n  const contractStart=$('#erContractStart').value||$('#erStartDate').value||null, contractEnd=$('#erContractEnd').value||null;\n  const matchingRents=currentRows(state.rentRates,r.id,s.id), existingRent=newestRow(matchingRents);\n  let rentErr=null;\n  if(existingRent){\n    const patch={};\n    patch.monthly_rent=rent;\n    patch.monthly_fee=fee;\n    patch.deposit_amount=deposit;\n    patch.payment_day_start=payDay;\n    patch.payment_day_end=payDay;\n    patch.valid_from=contractStart;\n    patch.is_active=true;\n    const ur=await sb.from('rent_rates').update(patch).eq('id',existingRent.id); re
